<!doctype html>
<html lang="id">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&display=swap">
<style>
/* Layout: quiet monochrome. A header row, then a grid of book covers like a shelf; the reader is a soft grey room with one white page. */
:root {
  --bg: #FFFFFF;
  --surface: #F6F6F6;
  --ink: #141414;
  --muted: #7A7A7A;
  --faint: #A8A8A8;
  --line: #E6E6E6;
  --accent: #141414;
  --accent-ink: #FFFFFF;
  --accent-soft: #F1F1F1;
  --danger: #C4372F;
  --desk: #EDEDED;
  --desk-2: #F4F4F4;
  --desk-ink: #1A1A1A;
  --desk-muted: #8A8A8A;
  --desk-hover: rgba(0, 0, 0, .06);
  --page-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 12px 32px rgba(0, 0, 0, .10);
  --cover-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 8px 20px rgba(0, 0, 0, .08);
  --paper: #FFFFFF;
  --paper-back: #F3F3F3;
  --shade: rgba(0, 0, 0, 0.14);
  --wall-top: #FFFFFF; --wall: #EFEFEF; --floor-far: #E4E4E4; --floor-near: #F7F7F7; --grid: rgba(0, 0, 0, .06); --dust: 255, 232, 180; --floor-shadow: 0, 0, 0;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #1A1A1A; --ink: #EDEDED; --muted: #8E8E8E; --faint: #5E5E5E; --line: #262626;
    --accent: #EDEDED; --accent-ink: #111111; --accent-soft: #1F1F1F; --danger: #EF6F67;
    --desk: #161616; --desk-2: #1C1C1C; --desk-ink: #E6E6E6; --desk-muted: #8A8A8A; --desk-hover: rgba(255, 255, 255, .07);
    --page-shadow: 0 12px 36px rgba(0, 0, 0, .5); --cover-shadow: 0 8px 22px rgba(0, 0, 0, .45);
    --paper-back: #EAEAEA; --shade: rgba(0, 0, 0, 0.4);
    --wall-top: #262626; --wall: #151515; --floor-far: #1D1D1D; --floor-near: #0E0E0E; --grid: rgba(255, 255, 255, .05); --dust: 255, 232, 180; --floor-shadow: 0, 0, 0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #1A1A1A; --ink: #EDEDED; --muted: #8E8E8E; --faint: #5E5E5E; --line: #262626;
  --accent: #EDEDED; --accent-ink: #111111; --accent-soft: #1F1F1F; --danger: #EF6F67;
  --desk: #161616; --desk-2: #1C1C1C; --desk-ink: #E6E6E6; --desk-muted: #8A8A8A; --desk-hover: rgba(255, 255, 255, .07);
  --page-shadow: 0 12px 36px rgba(0, 0, 0, .5); --cover-shadow: 0 8px 22px rgba(0, 0, 0, .45);
  --paper-back: #EAEAEA; --shade: rgba(0, 0, 0, 0.4);
    --wall-top: #262626; --wall: #151515; --floor-far: #1D1D1D; --floor-near: #0E0E0E; --grid: rgba(255, 255, 255, .05); --dust: 255, 232, 180; --floor-shadow: 0, 0, 0;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, label { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- Library ---------- */
#library { position: fixed; inset: 0; overflow: hidden; }
.fab { position: fixed; z-index: 10; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, .22); transition: opacity .15s; }
.fab:hover { opacity: .85; }
.fab svg { width: 20px; height: 20px; }
.fab-menu { position: fixed; z-index: 11; top: calc(72px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 4px; width: min(280px, calc(100vw - 32px)); max-height: calc(100dvh - 88px - env(safe-area-inset-top, 0px)); overflow: auto; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 64px rgba(0, 0, 0, .2); animation: rise .25s cubic-bezier(.2, .8, .2, 1); }
.menu-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 8px; }
.menu-head strong { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.menu-status { display: flex; flex-direction: column; gap: 2px; padding: 2px 8px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font-size: 14px; text-align: left; cursor: pointer; }
.menu-item:hover { background: var(--surface); }
.menu-item svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.menu-rooms { padding: 8px 8px 4px; }
.menu-label { display: block; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
.rooms { display: flex; flex-wrap: wrap; gap: 6px; }
.room-pick { width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; }
.room-pick:hover { color: var(--ink); }
.room-pick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.chip[data-s="ok"]::before { background: #3BA55C; }
.chip[data-s="err"]::before { background: var(--danger); }

.who { color: var(--muted); font-size: 13px; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auth-dialog { width: min(400px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); margin: auto; padding: 0; overflow: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--bg); color: var(--ink); box-shadow: 0 24px 64px rgba(0, 0, 0, .14); }
.auth-dialog[open] { animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
.auth-dialog::backdrop { background: rgba(0, 0, 0, .5); }
.auth { position: relative; display: flex; flex-direction: column; gap: 18px; padding: 24px; }
.auth-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-right: 26px; }
.auth-copy strong { font-weight: 500; font-size: 16px; }
.auth-copy span { color: var(--muted); font-size: 13.5px; }
.auth-fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.auth input { min-width: 0; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; }
.auth-switch { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: 13px; color: var(--muted); }
.auth-switch span:empty { display: none; }
.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.say { position: fixed; z-index: 12; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: min(460px, calc(100vw - 32px)); margin: 0; padding: 10px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .16); font-size: 13px; color: var(--muted); }
.say[data-k="err"] { color: var(--danger); }
.say[data-k="busy"]::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; vertical-align: -1px; border: 1.5px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap; transition: opacity .15s, background .15s; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { opacity: .85; }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
.btn.ghost:hover { color: var(--ink); }
.btn.danger { background: var(--danger); color: #FFFFFF; }
.btn.sm { min-height: 30px; padding: 0 12px; font-size: 13px; }

#count { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 40px 20px; padding-top: 8px; }
.item { --w: min(124px, 33vw); display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }

/* A floating 3D book: a CSS box (cover, spine, page block, top, back) tilted to show its spine, bobbing on a loop. */
.b3 { --h: calc(var(--w) * 1.42); --t: 20px; --spine: #2B2B2B; --spine-ink: #FFFFFF; position: relative; width: var(--w); height: var(--h); margin-block: 10px 22px; padding: 0; border: 0; background: none; cursor: pointer; perspective: 900px; animation: arrive .9s cubic-bezier(.2, .9, .25, 1.15) both; animation-delay: var(--in, 0s); }
.b3:focus-visible { outline: none; }
.b3 .float { position: absolute; inset: 0; transform-style: preserve-3d; animation: bob var(--dur, 6s) ease-in-out var(--phase, 0s) infinite; }
.b3 .body { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(5deg) rotateY(var(--tilt, 28deg)); transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
.b3:hover .body, .b3:focus-visible .body { transform: rotateX(0deg) rotateY(8deg) translateZ(22px); }
.b3 .f { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.b3 .front { inset: 0; transform: translateZ(calc(var(--t) / 2)); border-radius: 1px 3px 3px 1px; overflow: hidden; background: var(--surface); }
.b3 .front img { width: 100%; height: 100%; object-fit: cover; display: block; }
.b3 .front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(0, 0, 0, .18), rgba(255, 255, 255, .08) 4%, transparent 9%), linear-gradient(115deg, rgba(255, 255, 255, .22), transparent 40%); }
.b3 .ph { display: grid; place-items: center; width: 100%; height: 100%; padding: 12px; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--surface); text-align: center; }
.b3 .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ink); z-index: 1; }
.b3 .back { inset: 0; transform: rotateY(180deg) translateZ(calc(var(--t) / 2)); background: var(--spine); border-radius: 3px 1px 1px 3px; }
.b3 .spine { top: 0; left: calc(50% - var(--t) / 2); width: var(--t); height: 100%; transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); background: linear-gradient(to right, rgba(0, 0, 0, .25), rgba(255, 255, 255, .10) 45%, rgba(0, 0, 0, .18)), var(--spine); color: var(--spine-ink); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.b3 .spine span { writing-mode: vertical-rl; font-size: 9.5px; font-weight: 500; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 86%; opacity: .9; }
.b3 .pages { top: 2px; left: calc(50% - var(--t) / 2 + 1px); width: calc(var(--t) - 2px); height: calc(100% - 4px); transform: rotateY(90deg) translateZ(calc(var(--w) / 2 - 3px)); background: repeating-linear-gradient(to right, #F7F7F7 0 1px, #DADADA 1px 2px); }
.b3 .top { left: 0; top: calc(50% - var(--t) / 2 + 1px); width: calc(100% - 3px); height: calc(var(--t) - 2px); transform: rotateX(90deg) translateZ(calc(var(--h) / 2 - 2px)); background: repeating-linear-gradient(#F7F7F7 0 1px, #DCDCDC 1px 2px); }
.b3 .bottom { left: 0; top: calc(50% - var(--t) / 2 + 1px); width: calc(100% - 3px); height: calc(var(--t) - 2px); transform: rotateX(-90deg) translateZ(calc(var(--h) / 2 - 2px)); background: repeating-linear-gradient(#EFEFEF 0 1px, #CFCFCF 1px 2px); }
.b3 .shadow { position: absolute; left: 8%; right: 8%; bottom: -26px; height: 14px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .22), transparent); animation: shadow var(--dur, 6s) ease-in-out var(--phase, 0s) infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotateZ(0deg); } 50% { transform: translateY(-12px) rotateZ(-1.2deg); } }
@keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.8); opacity: .55; } }
@keyframes arrive { from { opacity: 0; transform: translateY(-70px) rotate(-6deg) scale(.9); } to { opacity: 1; transform: none; } }
.b3.seen { animation: none; }
.info { display: flex; flex-direction: column; gap: 3px; min-width: 0; width: calc(var(--w) + 24px); }
.info h3 { margin: 0; font-weight: 500; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub { margin: 0; color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.where { margin: 0; color: var(--faint); font-size: 12.5px; }
.del { display: inline-grid; place-items: center; width: 28px; height: 28px; margin: -4px -6px -4px 0; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; flex: none; }
.del:hover { color: var(--ink); background: var(--surface); }
.del svg { width: 15px; height: 15px; }
.confirm { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.confirm p { margin: 0; font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100vw - 48px)); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 20px; text-align: center; color: var(--muted); background: color-mix(in srgb, var(--bg) 84%, transparent); border: 1px dashed var(--line); border-radius: 16px; cursor: pointer; }
.empty strong { color: var(--ink); font-weight: 500; font-size: 16px; }
.empty span { max-width: 42ch; font-size: 14px; }
.loadingShelf { position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; color: var(--muted); font-size: 14px; }
.dropzone { position: fixed; inset: 12px; z-index: 20; display: grid; place-items: center; border: 1.5px dashed var(--ink); border-radius: 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); font-size: 16px; font-weight: 500; pointer-events: none; }

/* ---------- Reader ---------- */
#reader { position: fixed; inset: 0; z-index: 10; background: var(--desk); color: var(--desk-ink); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.rbar { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 12px; transition: opacity .2s, transform .2s; }
.rbar.bottom { gap: 12px; padding-bottom: 12px; }
#reader.calm .rbar { opacity: 0; pointer-events: none; }
#reader.calm .rbar.topbar { transform: translateY(-8px); }
#reader.calm .rbar.bottom { transform: translateY(8px); }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: transparent; color: var(--desk-ink); cursor: pointer; }
.ibtn:hover { background: var(--desk-hover); }
.ibtn:disabled { opacity: .25; cursor: default; background: transparent; }
.ibtn svg { width: 20px; height: 20px; }
.rtitle { flex: 1; min-width: 0; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zoomctl { display: flex; align-items: center; flex: none; }
.zoomctl .ibtn { width: 36px; height: 36px; font-size: 16px; font-weight: 500; font-family: var(--f-body); }
.zoomval { min-width: 5ch; height: 36px; padding: 0 2px; border: 0; border-radius: 8px; background: transparent; color: var(--desk-muted); font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; }
.zoomval:hover { background: var(--desk-hover); }
#stage.zoomed { cursor: move; }
#book { transform-origin: 0 0; }
#wordMark { position: absolute; border-radius: 3px; background: rgba(240, 190, 60, .4); pointer-events: none; }
.wordbox { position: absolute; z-index: 5; width: min(340px, calc(100vw - 24px)); max-height: min(46vh, 380px); overflow: auto; padding: 14px 16px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 48px rgba(0, 0, 0, .25); animation: rise .2s cubic-bezier(.2, .8, .2, 1); }
.wordbox .close { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; }
.wordbox .close:hover { background: var(--surface); color: var(--ink); }
.wb-word { margin: 0; padding-right: 26px; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.wb-from { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
.wb-list + .wb-from { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 500; color: var(--ink); }
.wb-pos { margin: 12px 0 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
.wb-list { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; line-height: 1.45; }
.wb-ex { display: block; margin-top: 2px; color: var(--muted); font-style: italic; font-size: 12.5px; }
.wb-note { margin: 8px 0 0; padding-right: 26px; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.wb-note:first-child { margin-top: 0; }
.pageno { font-family: var(--f-mono); font-size: 12.5px; color: var(--desk-muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 7ch; text-align: right; }
#slider { flex: 1; min-width: 0; accent-color: var(--desk-ink); height: 28px; }

#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#book { position: absolute; background: var(--paper); box-shadow: var(--page-shadow); }
#book canvas { display: block; width: 100%; height: 100%; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

.rload { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--desk-muted); font-size: 14px; }
.rload[data-err] { color: var(--desk-ink); }
.toast { position: absolute; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 8px 8px 8px 16px; border-radius: 999px; background: var(--bg); color: var(--ink); box-shadow: 0 8px 28px rgba(0, 0, 0, .16); font-size: 13.5px; }
.toast .btn { min-height: 32px; }
.edgehint { animation: nudge .35s ease; }
@keyframes nudge { 30% { transform: translateX(-10px); } 70% { transform: translateX(6px); } }

@media (max-width: 560px) {
  .sheet-card { grid-template-columns: 64px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .rbar, .btn { transition: none; }
  .sheet-card, .auth-dialog[open], .fab-menu, .wordbox { animation: none; }
}

/* ---------- weightless scene ---------- */
/* The room: a box of canvases in real 3D. #world is moved by the camera; everything inside it keeps its place. */
#room { position: fixed; inset: 0; overflow: hidden; background: #2E1C10; perspective-origin: 50% 50%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#room.looking { cursor: grabbing; }
#world, #walls, #space { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
#world { left: 50%; top: 50%; }
.wall { position: absolute; display: block; pointer-events: none; backface-visibility: visible; }
#dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.fs { position: absolute; left: 0; top: 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--floor-shadow), .55), rgba(var(--floor-shadow), 0)); pointer-events: none; will-change: transform; opacity: 0; }
#space { --w: 130px; }
#space .b3 { touch-action: none; cursor: grab; position: absolute; left: 0; top: 0; margin: 0; perspective: none; transform-style: preserve-3d; animation: none; will-change: transform; opacity: 0; }
#space .b3 .body { transform: none; transition: none; }
.b3 .cap { position: absolute; left: 50%; top: calc(100% + 16px); transform: translateX(-50%); max-width: 170px; padding: 2px 8px; border-radius: 8px; background: var(--bg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--ink); opacity: 0; transition: opacity .2s; pointer-events: none; }
.b3:hover .cap { opacity: 1; }
.credit { margin-top: 0; border-top: 0; padding-top: 2px; color: var(--faint); }
.credit a { color: inherit; }
.gesture { margin: 8px 0 0; padding: 8px 8px 0; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.45; color: var(--muted); }

.sheet { position: fixed; inset: 0; z-index: 15; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-card { position: relative; display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 16px; width: min(460px, 100%); padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 64px rgba(0, 0, 0, .14); animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.sheet-cover { aspect-ratio: 0.7; border-radius: 3px; overflow: hidden; background: var(--surface); box-shadow: var(--cover-shadow); align-self: start; }
.sheet-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet-cover .ph { display: grid; place-items: center; height: 100%; padding: 6px; font-size: 11px; color: var(--muted); text-align: center; }
.sheet-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding-right: 26px; }
.sheet-info h3 { margin: 0; font-weight: 500; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.sheet .bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; margin-block: 2px; }
.sheet .bar span { display: block; height: 100%; background: var(--ink); }
.sheet .row { margin-top: 6px; }
.sheet .close, .auth .close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; }
.sheet .close:hover, .auth .close:hover { background: var(--surface); color: var(--ink); }
</style>
</head>
<body>


<div id="library">
  <div id="room">
    <div id="world"><div id="walls"></div><div id="space"></div></div>
    <canvas id="dust"></canvas>
  </div>
  <button class="fab" id="fab" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="fab-menu" id="menu" hidden>
    <div class="menu-head"><strong>Rak Baca</strong><span id="count"></span></div>
    <div class="menu-status">
      <span id="sync" class="chip" data-s="wait">Menghubungkan…</span>
      <span id="account" class="who" hidden></span>
    </div>
    <label class="menu-item" id="menuUpload" for="file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Unggah buku</label>
    <input type="file" id="file" accept="application/pdf,.pdf,application/epub+zip,.epub" hidden>
    <button class="menu-item" id="login" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.500 2 8 6"/></svg>Masuk</button>
    <button class="menu-item" id="tidy" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h10M5 17h6"/></svg>Rapikan buku</button>
    <button class="menu-item" id="logout" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v14h-5M10 8l-4 4 4 4M6 12h9"/></svg>Keluar</button>
    <div class="menu-rooms" id="roomsBox" hidden>
      <span class="menu-label">Ruangan</span>
      <div class="rooms" id="rooms"></div>
    </div>
    <p class="gesture" id="gesture"></p>
    <p class="gesture credit">Arti kata dari <a href="https://github.com/globalwordnet/english-wordnet" target="_blank" rel="noopener">Open English WordNet</a> (CC BY 4.0), turunan <a href="https://wordnet.princeton.edu/" target="_blank" rel="noopener">Princeton WordNet</a>.</p>
  </div>
  <dialog id="authDialog" class="auth-dialog" aria-labelledby="authTitle">
    <form id="auth" class="auth">
      <div class="auth-copy">
        <strong id="authTitle">Masuk untuk sinkron</strong>
        <span>Buku dan halaman terakhirmu tersimpan di akun, jadi HP dan laptop selalu nyambung.</span>
      </div>
      <div class="auth-fields">
        <input id="email" type="email" autocomplete="email" placeholder="Email" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="Kata sandi" minlength="6" required>
        <button class="btn primary" id="authGo" type="submit">Masuk</button>
      </div>
      <p class="auth-switch"><span id="authMsg" aria-live="polite"></span><button type="button" class="link" id="authMode">Belum punya akun? Daftar</button></p>
      <button type="button" class="close" id="authClose" aria-label="Tutup">×</button>
    </form>
  </dialog>
  <p id="say" class="say" hidden></p>

  <p id="loadingShelf" class="loadingShelf">Memuat rak…</p>
  <label id="empty" class="empty" for="file" hidden>
    <strong>Rak masih kosong</strong>
    <span id="hint">Ketuk untuk mengunggah PDF atau EPUB, atau tarik file ke sini. Maksimal 50 MB per file.</span>
  </label>
  <div id="drop" class="dropzone" hidden>Lepas untuk menaruh di rak</div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="shTitle">
      <div class="sheet-cover" id="shCover"></div>
      <div class="sheet-info">
        <h3 id="shTitle"></h3>
        <p class="sub" id="shSub"></p>
        <div class="bar"><span id="shBar"></span></div>
        <p class="where" id="shWhere"></p>
        <div class="row" id="shActs">
          <button class="btn primary sm" id="shRead">Mulai baca</button>
          <button class="btn ghost sm" id="shDel">Hapus</button>
        </div>
        <div class="confirm" id="shConfirm" hidden>
          <p id="shConfirmText"></p>
          <div class="row">
            <button class="btn danger sm" id="shYes">Hapus</button>
            <button class="btn ghost sm" id="shNo">Batal</button>
          </div>
        </div>
      </div>
      <button class="close" id="shClose" aria-label="Tutup">×</button>
    </div>
  </div>
</div>

<div id="reader" hidden>
  <div class="rbar topbar">
    <button class="ibtn" id="back" aria-label="Kembali ke rak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="rtitle" id="rTitle"></div>
    <div class="zoomctl" role="group">
      <button class="ibtn" id="zoomOut"></button>
      <button class="zoomval" id="zoomVal"></button>
      <button class="ibtn" id="zoomIn"></button>
    </div>
  </div>
  <div id="stage">
    <div id="book"><canvas id="cR"></canvas><div id="wordMark" hidden></div></div>
    <canvas id="fx" hidden></canvas>
    <div class="rload" id="rload" hidden></div>
  </div>
  <div class="rbar bottom">
    <button class="ibtn" id="prev" aria-label="Halaman sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <input type="range" id="slider" min="1" max="1" value="1" aria-label="Pindah ke halaman">
    <span class="pageno" id="pageno">–</span>
    <button class="ibtn" id="next" aria-label="Halaman berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="wordbox" id="wordbox" role="dialog" aria-label="Arti kata" hidden>
    <div id="wbBody"></div>
    <button class="close" id="wbClose" aria-label="Tutup">×</button>
  </div>
  <div class="toast" id="toast" hidden><span id="toastText"></span><button class="btn primary" id="toastBtn"></button></div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const MAX_BYTES = 50 * 1024 * 1024; // Supabase free plan: 50 MB per file
  const coarse = matchMedia("(pointer: coarse)").matches;
  const DEVICE = coarse ? (Math.min(screen.width, screen.height) < 700 ? "HP" : "tablet") : "laptop";
  const SESSION = Math.random().toString(36).slice(2);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // pdf.js parses PDFs in a real Web Worker shipped with the app.
  const pdfjs = window.pdfjsLib || window["pdfjs-dist/build/pdf"] || null;
  if (pdfjs) pdfjs.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";
  const openPdf = (bytes) => pdfjs.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;

  // ---------- small helpers ----------
  const lsGet = (k) => { try { const v = localStorage.getItem("rakbaca:" + k); return v ? JSON.parse(v) : null; } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem("rakbaca:" + k, JSON.stringify(v)); } catch {} };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmtMB = (b) => (b / 1048576).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + " MB";
  const rtf = new Intl.RelativeTimeFormat("id", { numeric: "auto" });
  function rel(t) {
    const s = (t - Date.now()) / 1000, a = Math.abs(s);
    if (a < 60) return "baru saja";
    if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
    if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
    if (a < 86400 * 30) return rtf.format(Math.round(s / 86400), "day");
    return new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
    return el;
  }
  const cleanTitle = (name) => name.replace(/\.pdf$/i, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim() || "Tanpa judul";

  // IndexedDB cache of downloaded PDFs, so reopening a book doesn't redownload it.
  const idb = (() => {
    let p;
    const open = () => p || (p = new Promise((res, rej) => {
      try { const r = indexedDB.open("rakbaca", 1); r.onupgradeneeded = () => r.result.createObjectStore("pdf"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    }));
    const tx = async (mode, fn) => { try { const d = await open(); return await new Promise((res) => { const t = d.transaction("pdf", mode); const q = fn(t.objectStore("pdf")); t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => res(null); }); } catch { return null; } };
    return {
      get: (k) => tx("readonly", (s) => s.get(k)).then((v) => v || null),
      put: (k, v) => tx("readwrite", (s) => s.put(v, k)),
      del: (k) => tx("readwrite", (s) => s.delete(k)),
    };
  })();
  const memBytes = new Map();
  function remember(key, bytes) { memBytes.delete(key); memBytes.set(key, bytes); while (memBytes.size > 3) memBytes.delete(memBytes.keys().next().value); }

  // ---------- state ----------
  let db = null, assets = null, user = null, uid = null, libReady = false;
  let books = new Map();        // shared library: id -> {title, fileId, coverId, pages, sizeBytes, addedAt}
  let progress = new Map();     // this viewer's progress: id -> {page, total, updatedAt, device, session}
  const localBooks = new Map(); // opened without syncing (no account in this view)

  function setSync(s) {
    const el = $("#sync"); el.dataset.s = s;
    el.textContent = { ok: "Tersinkron", local: "Belum masuk", offline: "Offline · memakai salinan terakhir", err: "Gagal menyimpan, dicoba lagi saat pindah halaman", wait: "Menghubungkan…" }[s];
  }
  let sayTimer = 0;
  function say(kind, text) {
    const el = $("#say");
    clearTimeout(sayTimer);
    if (!text) { el.hidden = true; return; }
    el.hidden = false; el.dataset.k = kind; el.textContent = text;
    if (kind !== "busy") sayTimer = setTimeout(() => { el.hidden = true; }, kind === "err" ? 9000 : 6000);
  }

  // ---------- cloud (Supabase) ----------
  // Books, covers and reading progress live in the reader's own Supabase project (see supabase/setup.sql).
  // Files sit in the private "books" bucket under <user id>/<book id>/; row-level security keeps each account to itself.
  const CFG = window.RAKBACA_CONFIG || {};
  const sb = CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase
    ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } })
    : null;
  const rowToBook = (r) => ({ kind: r.kind, title: r.title, author: r.author || "", fileId: r.file_path, coverId: r.cover_path, pages: r.pages, sizeBytes: r.size_bytes, addedAt: r.added_at, addedFrom: r.added_from });
  const rowToProg = (r) => ({ page: r.page, total: r.total, loc: r.loc || undefined, device: r.device, session: r.session, updatedAt: r.updated_at });
  const coverUrls = new Map();
  const cloud = {
    async loadBooks() {
      const { data, error } = await sb.from("books").select("*").order("added_at");
      if (error) throw error;
      const m = new Map(data.map((r) => [r.id, rowToBook(r)]));
      for (const b of m.values()) b.coverUrl = coverUrls.get(b.coverId) || null;
      return m;
    },
    async loadProgress() {
      const { data, error } = await sb.from("progress").select("*");
      if (error) throw error;
      return new Map(data.map((r) => [r.book_id, rowToProg(r)]));
    },
    async addBook(meta, fileBlob, fileType, coverBlob) {
      const id = crypto.randomUUID(), base = `${uid}/${id}/`;
      const filePath = base + (meta.kind === "epub" ? "book.json" : "book.pdf");
      let r = await sb.storage.from("books").upload(filePath, fileBlob, { contentType: fileType, upsert: false });
      if (r.error) throw r.error;
      let coverPath = null;
      if (coverBlob) {
        r = await sb.storage.from("books").upload(base + "cover.jpg", coverBlob, { contentType: "image/jpeg" });
        if (!r.error) coverPath = base + "cover.jpg";
      }
      const row = { id, user_id: uid, kind: meta.kind, title: meta.title, author: meta.author || null, file_path: filePath, cover_path: coverPath, pages: meta.pages, size_bytes: meta.sizeBytes, added_at: Date.now(), added_from: DEVICE };
      const ins = await sb.from("books").insert(row);
      if (ins.error) { await sb.storage.from("books").remove([filePath, coverPath].filter(Boolean)); throw ins.error; }
      return { id, filePath };
    },
    async deleteBook(id, b) {
      const del = await sb.from("books").delete().eq("id", id);
      if (del.error) throw del.error;
      await sb.storage.from("books").remove([b.fileId, b.coverId].filter(Boolean));
    },
    async fileUrl(b) {
      const { data, error } = await sb.storage.from("books").createSignedUrl(b.fileId, 3600);
      if (error) throw error;
      return data.signedUrl;
    },
    async saveProgress(id, body) {
      const { error } = await sb.from("progress").upsert({
        user_id: uid, book_id: id, page: body.page, total: body.total, loc: body.loc || null,
        device: body.device, session: body.session, updated_at: body.updatedAt,
      });
      if (error) throw error;
    },
  };
  // Covers are downloaded once and kept in IndexedDB, so the shelf shows them offline too.
  async function loadCover(b) {
    if (!b.coverId || coverUrls.has(b.coverId)) return;
    coverUrls.set(b.coverId, null);
    let blob = await idb.get("cover:" + b.coverId);
    if (!blob) {
      const { data } = await sb.storage.from("books").download(b.coverId);
      if (!data) { coverUrls.delete(b.coverId); return; }
      blob = data; idb.put("cover:" + b.coverId, blob);
    }
    const url = URL.createObjectURL(blob);
    coverUrls.set(b.coverId, url);
    for (const bk of books.values()) if (bk.coverId === b.coverId) bk.coverUrl = url;
    renderLibrary();
  }

  // ---------- account ----------
  let authMode = "in";
  function showAccount(user) {
    $("#login").hidden = !!user || !sb;
    if (user && $("#authDialog").open) $("#authDialog").close();
    $("#account").hidden = !user; $("#account").textContent = user?.email || "";
    $("#logout").hidden = !user;
  }
  const authError = (e) => {
    const m = (e && e.message) || "";
    if (/invalid login credentials/i.test(m)) return "Email atau kata sandi salah.";
    if (/already registered/i.test(m)) return "Email ini sudah terdaftar. Coba masuk.";
    if (/password should be at least/i.test(m)) return "Kata sandi minimal 6 karakter.";
    if (/email not confirmed/i.test(m)) return "Email belum dikonfirmasi. Buka email dari Supabase lalu klik tautannya.";
    if (/fetch|network/i.test(m)) return "Tidak bisa terhubung. Periksa koneksi internet.";
    return m || "Gagal masuk. Coba lagi.";
  };
  $("#login").addEventListener("click", () => { closeMenu(); $("#authDialog").showModal(); });
  $("#authClose").addEventListener("click", () => $("#authDialog").close());
  // A press on the dialog element itself lands on the backdrop; the form fills the rest of it.
  $("#authDialog").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  $("#authDialog").addEventListener("close", () => { $("#authMsg").textContent = ""; $("#password").value = ""; });
  $("#authMode").addEventListener("click", () => {
    authMode = authMode === "in" ? "up" : "in";
    $("#authGo").textContent = authMode === "in" ? "Masuk" : "Daftar";
    $("#authMode").textContent = authMode === "in" ? "Belum punya akun? Daftar" : "Sudah punya akun? Masuk";
    $("#password").autocomplete = authMode === "in" ? "current-password" : "new-password";
    $("#authMsg").textContent = "";
  });
  $("#auth").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sb) return;
    const email = $("#email").value.trim(), password = $("#password").value;
    const btn = $("#authGo"); btn.disabled = true; $("#authMsg").textContent = "Sebentar…";
    try {
      const res = authMode === "in" ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
      if (res.error) $("#authMsg").textContent = authError(res.error);
      else if (!res.data.session) $("#authMsg").textContent = "Akun dibuat. Buka email konfirmasi dari Supabase, lalu masuk di sini.";
      else { $("#authMsg").textContent = ""; $("#password").value = ""; }
    } catch (err) { $("#authMsg").textContent = authError(err); }
    finally { btn.disabled = false; }
  });
  $("#logout").addEventListener("click", () => { closeMenu(); if (sb) sb.auth.signOut(); });

  // ---------- boot ----------
  let refreshTimer = null, channel = null;
  async function refresh() {
    if (!uid) return;
    try {
      const [bk, pg] = await Promise.all([cloud.loadBooks(), cloud.loadProgress()]);
      books = bk; progress = pg; libReady = true;
      lsSet("cache:books:" + uid, [...books.entries()].map(([id, b]) => [id, Object.assign({}, b, { coverUrl: null })]));
      setSync("ok");
      for (const b of books.values()) loadCover(b);
      renderLibrary(); checkRemote();
    } catch {
      setSync("offline"); libReady = true; renderLibrary();
    }
  }
  const refreshSoon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 300); };
  async function startSession(session) {
    uid = session?.user?.id || null;
    showAccount(session?.user || null);
    if (channel) { sb.removeChannel(channel); channel = null; }
    if (!uid) {
      db = assets = null; books = new Map(); progress = new Map(); libReady = true;
      setSync("local"); renderLibrary(); return;
    }
    db = assets = cloud;
    // Show the last known shelf straight away (works offline), then refresh from the server.
    const cached = lsGet("cache:books:" + uid);
    if (cached) { books = new Map(cached); libReady = true; for (const b of books.values()) loadCover(b); renderLibrary(); }
    await refresh();
    channel = sb.channel("rak-" + uid)
      .on("postgres_changes", { event: "*", schema: "public", table: "books", filter: `user_id=eq.${uid}` }, refreshSoon)
      .on("postgres_changes", { event: "*", schema: "public", table: "progress", filter: `user_id=eq.${uid}` }, refreshSoon)
      .subscribe();
  }
  (async () => {
    queueMicrotask(renderLibrary);
    if (!sb) {
      libReady = true; setSync("local"); showAccount(null);
      $("#hint").textContent = "Ketuk untuk membuka PDF atau EPUB. Sinkron belum disetel, jadi buku hanya terbuka di perangkat ini.";
      return;
    }
    const { data } = await sb.auth.getSession();
    await startSession(data.session);
    sb.auth.onAuthStateChange((ev, session) => {
      if ((session?.user?.id || null) !== uid) startSession(session);
    });
  })();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && uid) refreshSoon(); });

  // ---------- library ----------
  function getProg(id) {
    const r = progress.get(id), l = lsGet("prog:" + id);
    if (r && (!l || r.updatedAt >= l.updatedAt)) return r;
    return l;
  }
  function renderLibrary() {
    const all = [...localBooks.entries(), ...books.entries()];
    all.sort((a, b) => (a[1].addedAt || 0) - (b[1].addedAt || 0)); // oldest first, so a new book takes the next free spot
    allBooks = all;
    scene.room = clamp(scene.room, 0, roomCount() - 1);
    $("#gesture").textContent = coarse

    el.addEventListener("pointerup", (e) => end(e, false));
    el.addEventListener("pointercancel", (e) => end(e, true));
    el.addEventListener("click", (e) => { if (e.detail === 0) select(s.id); }); // keyboard activation
  }
  $("#tidy").addEventListener("click", () => {
    for (const s of scene.els.values()) { try { localStorage.removeItem("rakbaca:pos3:" + s.id); } catch {} s.custom = false; s.thrown = false; }
    $("#tidy").hidden = true; layoutScene(); kick(); closeMenu();
  });

  // Two-finger pinch on a phone: spread to pull the book closer, pinch in to push it back.
  let pinch = null;
  const touchDist = (e) => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  roomEl.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 2) return;
    const all = [...scene.els.values()];
    let s = all.find((b) => b.drag);
    if (!s) { const el = e.target.closest && e.target.closest(".b3"); s = el && all.find((b) => b.el === el); }
    if (!s) {
      // fingers landed beside the books: take the one nearest the middle of the two fingers
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2, my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      let best = Infinity;
      for (const b of all) { const r = b.el.getBoundingClientRect(), dd = Math.hypot(r.left + r.width / 2 - mx, r.top + r.height / 2 - my); if (dd < best) { best = dd; s = b; } }
    }
    if (!s) return;
    pinch = { s, last: touchDist(e) };
    if (s.drag) s.drag.pinched = true;
    s.hover = 1;
    e.preventDefault();
  }, { passive: false });
  roomEl.addEventListener("touchmove", (e) => {
    if (!pinch || e.touches.length !== 2) return;
    const s = pinch.s, d = touchDist(e);
    pushBook(s, (d - pinch.last) * 2.4);
    pinch.last = d;
    if (s.drag) s.drag.pinched = true;
    e.preventDefault(); kick();
  }, { passive: false });
  const endPinch = (e) => {
    if (!pinch || e.touches.length >= 2) return;
    const s = pinch.s; pinch = null; s.hover = 0;
    savePos(s); kick();
  };
  roomEl.addEventListener("touchend", endPinch);
  roomEl.addEventListener("touchcancel", endPinch);

  // ---------- rooms ----------

    scene.els.clear();

  // ---------- the walls, floor and ceiling ----------
  // A warm old library: wooden bookcases full of coloured spines, an oak floor with a rug, a beamed plaster ceiling.
  function buildRoomShell() {
    const box = $("#walls");
    const dark = cssVar("--bg", "#ffffff").toLowerCase() === "#111111";
    const key = `${scene.room}${dark ? "d" : "l"}`;
    if (box._key === key) return;
    box._key = key;
    // Everything is painted once per room and then only moved by the GPU, so the colour costs nothing while walking.
    const P = { case: "#6B4427", back: "#2E1C10", board: "#84582F", plinth: "#54341C", oak: ["#B98A57", "#AD7D4B", "#C39563", "#A67646"], grain: "rgba(70,38,12,.16)", seam: "rgba(50,26,8,.32)", plaster: "#F2E6D2", beam: "#7C5230", gold: "#D2AC5E", spines: ["#8C2F2B", "#B5533C", "#2F5D50", "#1F4E6B", "#C79A3B", "#5B3A6E", "#E4D3B0", "#3C6E47", "#A8662C", "#2B3A55", "#D9C9A6", "#6E2438"] };
    // Each room gets its own colour, on the frieze and the rug, so you can tell where you are.
    const accent = ["#7A2E2E", "#24524A", "#27456B", "#8A6420", "#4B2F63", "#2F5A6B"][scene.room % 6];
    const night = dark ? "rgba(10,8,16,.5)" : null; // dark theme: the same room with the lights lowered
    let seed = 11 + scene.room * 7919;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = (a) => a[(rnd() * a.length) | 0];
    const H = ROOM.floor - ROOM.ceil, W = ROOM.W, D = ROOM.D, midY = (ROOM.floor + ROOM.ceil) / 2;

    const plane = (w, h, transform, paint, tex) => {
      const c = document.createElement("canvas");
      c.className = "wall"; c.width = Math.round(w * tex); c.height = Math.round(h * tex);
      c.style.width = w + 2 + "px"; c.style.height = h + 2 + "px";
      c.style.left = -(w / 2 + 1) + "px"; c.style.top = -(h / 2 + 1) + "px";
      c.style.transform = transform;
      const x = c.getContext("2d", { alpha: false }); x.scale(tex, tex); paint(x, w, h);
      if (night) { x.fillStyle = night; x.fillRect(0, 0, w, h); }
      return c;
    };
    const bookcase = (x, w, h) => {
      const frieze = 80, plinth = 70, top = frieze + 12, inner = h - frieze - plinth - 12;
      x.fillStyle = P.case; x.fillRect(0, 0, w, h);
      const rows = 6, rh = inner / rows, cols = Math.max(2, Math.round(w / 300)), cw = w / cols;
      for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
        const ix = k * cw + 10, iy = top + r * rh + 7, iw = cw - 20, ih = rh - 14;
        x.fillStyle = P.back; x.fillRect(ix, iy, iw, ih);
        let bx = ix + 3;
        while (bx < ix + iw - 8) {
          const bw = 13 + rnd() * 24;
          if (rnd() < 0.08) { bx += bw * 1.5; continue; }
          const bh = ih * (0.62 + rnd() * 0.33), bw2 = Math.min(bw, ix + iw - bx - 1), by = iy + ih - bh;
          x.fillStyle = pick(P.spines); x.fillRect(bx, by, bw2, bh);
          x.fillStyle = "rgba(0,0,0,.2)"; x.fillRect(bx + bw2 - 3, by, 3, bh); // rounded spine: a sliver of shade
          if (rnd() < 0.45) { x.fillStyle = P.gold; x.fillRect(bx, by + bh * 0.14, bw2 - 3, 4); }
          bx += bw + 1;
        }
        // The shelf above throws a little shade on the books.
        const sh = x.createLinearGradient(0, iy, 0, iy + 34); sh.addColorStop(0, "rgba(0,0,0,.42)"); sh.addColorStop(1, "rgba(0,0,0,0)");
        x.fillStyle = sh; x.fillRect(ix, iy, iw, 34);
      }
      x.fillStyle = P.board;
      for (let r = 0; r <= rows; r++) x.fillRect(0, top + r * rh - 6, w, 12);
      for (let k = 0; k <= cols; k++) x.fillRect(k * cw - 8, top, 16, inner);
      x.fillStyle = accent; x.fillRect(0, 0, w, frieze);
      x.fillStyle = P.gold; x.fillRect(0, frieze - 7, w, 4);
      x.fillStyle = P.plinth; x.fillRect(0, h - plinth, w, plinth);
      // Warm light from above, falling away toward the floor.
      const g = x.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "rgba(255,226,170,.26)"); g.addColorStop(0.5, "rgba(255,226,170,.05)"); g.addColorStop(1, "rgba(25,12,0,.28)");
      x.fillStyle = g; x.fillRect(0, 0, w, h);
    };
    const floor = (x, w, h) => {
      const pw = 120;
      for (let i = 0; i < w; i += pw) {
        for (let j = -rnd() * 500; j < h;) {
          const len = 420 + rnd() * 520;
          x.fillStyle = pick(P.oak); x.fillRect(i, j, pw, len);
          x.fillStyle = P.grain;
          for (let g = 0; g < 3; g++) x.fillRect(i + 14 + rnd() * (pw - 28), j + 20, 3, len - 40);
          x.fillStyle = P.seam; x.fillRect(i, j, pw, 3);
          j += len;
        }
        x.fillStyle = P.seam; x.fillRect(i, 0, 3, h);
      }
      // A rug in the room's colour.
      const rw = w * 0.56, rh = h * 0.5, rx = (w - rw) / 2, ry = (h - rh) / 2;
      x.fillStyle = "rgba(30,14,2,.3)"; x.fillRect(rx + 10, ry + 14, rw, rh);
      x.fillStyle = accent; x.fillRect(rx, ry, rw, rh);
      x.strokeStyle = P.gold; x.lineWidth = 12; x.strokeRect(rx + 44, ry + 44, rw - 88, rh - 88);
      x.lineWidth = 4; x.strokeRect(rx + 74, ry + 74, rw - 148, rh - 148);
      x.fillStyle = "rgba(255,255,255,.05)";
      for (let k = 0; k < 8; k++) for (let m = 0; m < 10; m++) if ((k + m) % 2) x.fillRect(rx + 90 + k * (rw - 180) / 8, ry + 90 + m * (rh - 180) / 10, (rw - 180) / 8, (rh - 180) / 10);
      const p = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.62);
      p.addColorStop(0, "rgba(255,226,170,.2)"); p.addColorStop(0.55, "rgba(255,226,170,0)"); p.addColorStop(1, "rgba(25,12,0,.34)");
      x.fillStyle = p; x.fillRect(0, 0, w, h);
    };
    const ceiling = (x, w, h) => {
      x.fillStyle = P.plaster; x.fillRect(0, 0, w, h);
      const p = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.6);
      p.addColorStop(0, "rgba(255,250,235,.95)"); p.addColorStop(1, "rgba(150,110,70,.3)");
      x.fillStyle = p; x.fillRect(0, 0, w, h);
      x.fillStyle = P.beam;
      for (let i = 0; i <= 4; i++) x.fillRect(i * (w - 44) / 4, 0, 44, h);
      for (let j = 0; j <= 5; j++) x.fillRect(0, j * (h - 44) / 5, w, 44);
    };
    box.replaceChildren(
      plane(W, H, `translate3d(0,${midY}px,${-D / 2}px)`, bookcase, TEX),
      plane(W, H, `translate3d(0,${midY}px,${D / 2}px) rotateY(180deg)`, bookcase, TEX),
      plane(D, H, `translate3d(${-W / 2}px,${midY}px,0) rotateY(90deg)`, bookcase, TEX),
      plane(D, H, `translate3d(${W / 2}px,${midY}px,0) rotateY(-90deg)`, bookcase, TEX),
      plane(W, D, `translate3d(0,${ROOM.floor}px,0) rotateX(90deg)`, floor, SURFACE_TEX),
      plane(W, D, `translate3d(0,${ROOM.ceil}px,0) rotateX(-90deg)`, ceiling, SURFACE_TEX),
    );
  }

  // ---------- book sheet (details + actions for the tapped book) ----------

  $("#shYes").addEventListener("click", async (e) => {

  async function deleteBook(id, b, btn) {

    try {
