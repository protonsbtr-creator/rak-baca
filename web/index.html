  // ---------- EPUB ----------
  // The asset store can't hold .epub files, so an EPUB is unpacked on upload into a JSON "book":
  // text blocks with bold/italic runs, headings, list items, quotes and images (small JPEG data URLs).
  // When reading, those blocks are typeset onto canvas pages sized to the screen, so the paper curl works the same.
  const EPUB_FONT = '"Literata", Georgia, "Times New Roman", serif';
  const isEpubFile = (f) => f.type === "application/epub+zip" || /\.epub$/i.test(f.name);
  const isPdfFile = (f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  const BOLD = 1, ITALIC = 2;
  const IMG_TYPES = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml" };

  async function importEpub(file, onStep) {
    if (!window.JSZip) throw new Error("nozip");
    const zip = await JSZip.loadAsync(file);
    const read = (p) => (p && zip.file(p) ? zip.file(p).async("string") : Promise.resolve(null));
    const parse = (s, type) => new DOMParser().parseFromString(s, type);
    const container = await read("META-INF/container.xml");
    if (!container) throw new Error("bad");
    const opfPath = parse(container, "application/xml").querySelector("rootfile")?.getAttribute("full-path");
    const opfText = await read(opfPath);
    if (!opfText) throw new Error("bad");
    const opf = parse(opfText, "application/xml");
    const resolve = (from, href) => { try { return decodeURIComponent(new URL(href, "https://x/" + from).pathname.slice(1)); } catch { return null; } };
    const manifest = new Map();
    for (const it of opf.querySelectorAll("manifest > item")) {
      manifest.set(it.getAttribute("id"), { href: resolve(opfPath, it.getAttribute("href") || ""), type: it.getAttribute("media-type") || "", props: it.getAttribute("properties") || "" });
    }
    const dc = (n) => opf.getElementsByTagNameNS("http://purl.org/dc/elements/1.1/", n)[0]?.textContent.trim() || "";
    const spine = [...opf.querySelectorAll("spine > itemref")].map((r) => manifest.get(r.getAttribute("idref"))).filter((m) => m && /html|xml/.test(m.type));
    let coverItem = [...manifest.values()].find((m) => /cover-image/.test(m.props));
    if (!coverItem) {
      const cid = [...opf.querySelectorAll("meta")].find((m) => m.getAttribute("name") === "cover")?.getAttribute("content");
      if (cid) coverItem = manifest.get(cid);
    }

    let budget = 40 * 1024 * 1024;
    const imgCache = new Map();
    async function imageData(path, maxSide) {
      const key = path + "@" + maxSide;
      if (imgCache.has(key)) return imgCache.get(key);
      let out = null;
      try {
        const f = zip.file(path);
        if (f) {
          const ext = (path.split(".").pop() || "").toLowerCase();
          const blob = new Blob([await f.async("arraybuffer")], { type: IMG_TYPES[ext] || "image/jpeg" });
          let bmp;
          try { bmp = await createImageBitmap(blob); }
          catch { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(blob); }); }
          const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
          const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(bmp.width * s)); c.height = Math.max(1, Math.round(bmp.height * s));
          const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
          const src = c.toDataURL("image/jpeg", 0.8);
          if (src.length < budget) { budget -= src.length; out = { src, w: c.width, h: c.height, canvas: c }; }
        }
      } catch {}
      imgCache.set(key, out);
      return out;
    }

    const blocks = [];
    let runs = [], meta = {};
    const BLOCK = /^(p|div|h[1-6]|li|blockquote|pre|section|article|figure|figcaption|header|footer|aside|nav|table|tr|td|th|ul|ol|dl|dt|dd|body|center|main|address)$/;
    const flush = () => {
      if (runs.some((r) => r[0].trim())) {
        const merged = [];
        for (const r of runs) { const last = merged[merged.length - 1]; if (last && last[1] === r[1]) last[0] += r[0]; else merged.push([r[0], r[1]]); }
        blocks.push(Object.assign({ t: meta.h ? "h" : "p", r: merged }, meta.h ? { l: meta.h } : {}, meta.li ? { li: 1 } : {}, meta.q ? { q: 1 } : {}));
      }
      runs = [];
    };
    function walk(node, style, chap) {
      for (const n of node.childNodes) {
        if (n.nodeType === 3) { const s = n.nodeValue.replace(/\s+/g, " "); if (s) runs.push([s, style]); continue; }
        if (n.nodeType !== 1) continue;
        const tag = (n.localName || "").toLowerCase();
        if (tag === "script" || tag === "style" || tag === "head" || tag === "title") continue;
        if (tag === "br") { runs.push(["\n", style]); continue; }
        if (tag === "hr") { flush(); blocks.push({ t: "hr" }); continue; }
        if (tag === "img" || tag === "image") {
          const href = n.getAttribute("src") || n.getAttribute("href") || n.getAttributeNS("http://www.w3.org/1999/xlink", "href");
          if (href) { flush(); blocks.push({ t: "img", path: resolve(chap, href) }); }
          continue;
        }
        let st = style;
        if (/^(em|i|cite|var|dfn)$/.test(tag)) st |= ITALIC;
        if (/^(strong|b|th)$/.test(tag)) st |= BOLD;
        if (/^h[1-6]$/.test(tag)) {
          flush(); const prev = meta; meta = Object.assign({}, meta, { h: +tag[1] }); walk(n, st | BOLD, chap); flush(); meta = prev; continue;
        }
        if (tag === "li" || tag === "blockquote") {
          flush(); const prev = meta; meta = Object.assign({}, meta, tag === "li" ? { li: 1 } : { q: 1 });
          if (tag === "li") runs.push(["• ", style]);
          walk(n, st, chap); flush(); meta = prev; continue;
        }
        if (BLOCK.test(tag)) { flush(); walk(n, st, chap); flush(); continue; }
        walk(n, st, chap);
      }
    }
    for (let i = 0; i < spine.length; i++) {
      onStep?.(`Membaca bab ${i + 1} dari ${spine.length}…`);
      const text = await read(spine[i].href);
      if (!text) continue;
      let doc = parse(text, "application/xhtml+xml");
      if (doc.getElementsByTagName("parsererror").length) doc = parse(text, "text/html");
      const body = doc.body || doc.getElementsByTagName("body")[0];
      if (!body) continue;
      if (blocks.length && blocks[blocks.length - 1].t !== "ch") blocks.push({ t: "ch" });
      runs = []; meta = {};
      walk(body, 0, spine[i].href); flush();
    }
    onStep?.("Menyiapkan gambar…");
    const out = [];
    for (const b of blocks) {
      if (b.t !== "img") { out.push(b); continue; }
      const im = b.path ? await imageData(b.path, 1100) : null;
      if (im) out.push({ t: "img", src: im.src, w: im.w, h: im.h });
    }
    while (out.length && out[out.length - 1].t === "ch") out.pop();
    if (!out.some((b) => b.t === "p" || b.t === "h" || b.t === "img")) throw new Error("empty");

    const title = dc("title") || cleanTitle(file.name.replace(/\.epub$/i, ""));
    const author = dc("creator");
    let coverCanvas = null;
    if (coverItem?.href) coverCanvas = (await imageData(coverItem.href, 640))?.canvas || null;
    if (!coverCanvas) {
      const first = out.find((b) => b.t === "img");
      if (first) { const im = new Image(); im.src = first.src; try { await im.decode(); const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; c.getContext("2d").drawImage(im, 0, 0); coverCanvas = c; } catch {} }
    }
    if (!coverCanvas) coverCanvas = await plainCover(title, author);
    const cover = await new Promise((res) => coverCanvas.toBlob(res, "image/jpeg", 0.85));
    const words = out.reduce((n, b) => n + (b.r ? b.r.reduce((m, r) => m + r[0].split(/\s+/).length, 0) : 0), 0);
    let book = { v: 1, title, author, blocks: out };
    let json = JSON.stringify(book);
    if (json.length > MAX_BYTES - 200000) { book = { v: 1, title, author, blocks: out.filter((b) => b.t !== "img") }; json = JSON.stringify(book); }
    return { title, author, json, cover, pages: Math.max(1, Math.round(words / 260)) };
  }

  // A quiet generated cover for EPUBs that ship without one: title and author set on grey paper.
  async function plainCover(title, author) {
    await loadBookFonts();
    const c = document.createElement("canvas"); c.width = 320; c.height = 456;
    const x = c.getContext("2d");
    x.fillStyle = "#E8E8E8"; x.fillRect(0, 0, 320, 456);
    x.fillStyle = "#1A1A1A"; x.textAlign = "center";
    x.font = `600 26px ${EPUB_FONT}`;
    const words = title.split(/\s+/), lines = [];
    let line = "";
    for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > 250 && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    lines.slice(0, 5).forEach((l, i) => x.fillText(l, 160, 150 + i * 34));
    if (author) { x.font = `400 15px ${EPUB_FONT}`; x.fillStyle = "#6A6A6A"; x.fillText(author, 160, 400); }
    return c;
  }

  let fontsReady = null;
  function loadBookFonts() {
    if (!fontsReady) {
      const want = [`400 16px ${EPUB_FONT}`, `italic 400 16px ${EPUB_FONT}`, `600 16px ${EPUB_FONT}`, `italic 600 16px ${EPUB_FONT}`];
      fontsReady = Promise.race([
        Promise.all(want.map((f) => document.fonts?.load(f).catch(() => null))),
        new Promise((r) => setTimeout(r, 2500)),
      ]);
    }
    return fontsReady;
  }

  // Typeset the book into pages of W×H CSS px. Each page keeps where it starts ({b: block, w: word})
  // so the reading position survives a different screen size on another device.
  function typesetEpub(book, W, H) {
    const blocks = book.blocks;
    const fs = clamp(W / 23, 15, 19.5) * R.fontScale, lh = fs * 1.58;
    const mx = Math.round(clamp(W * 0.09, 20, 60)), top = Math.round(clamp(H * 0.075, 26, 64)), bottom = H - Math.round(clamp(H * 0.085, 34, 70));
    const cw = W - mx * 2;
    const mc = document.createElement("canvas").getContext("2d");
    const font = (st, size) => `${st & ITALIC ? "italic " : ""}${st & BOLD ? 600 : 400} ${size.toFixed(2)}px ${EPUB_FONT}`;
    const wcache = new Map();
    const measure = (s, f) => { const k = f + "|" + s; let w = wcache.get(k); if (w == null) { mc.font = f; w = mc.measureText(s).width; wcache.set(k, w); } return w; };
    const pages = [];
    let page, y;
    const newPage = (b, w) => { page = { start: { b, w }, ops: [] }; pages.push(page); y = top; };
    newPage(0, 0);
    let afterHeading = true, chapterTop = true;
    blocks.forEach((blk, bi) => {
      if (blk.t === "ch") { if (page.ops.length) newPage(bi, 0); afterHeading = true; chapterTop = true; return; }
      if (blk.t === "hr") { if (y + lh * 2 > bottom) newPage(bi, 0); page.ops.push({ k: "hr", y: y + lh }); y += lh * 2; afterHeading = true; return; }
      if (blk.t === "img") {
        let s = Math.min(cw / blk.w, (bottom - top) / blk.h, 1.25);
        // Shrink to fit what's left of the page when that keeps at least 55% of its size; otherwise start a new page.
        if (y + blk.h * s > bottom && page.ops.length && (bottom - y) < blk.h * s * 0.55) newPage(bi, 0);
        s = Math.min(s, (bottom - y) / blk.h);
        const dw = blk.w * s, dh = blk.h * s;
        page.ops.push({ k: "img", bi, x: mx + (cw - dw) / 2, y, w: dw, h: dh });
        y += dh + lh * 0.6; afterHeading = false; chapterTop = false;
        return;
      }
      const isH = blk.t === "h";
      const size = isH ? fs * (blk.l <= 1 ? 1.55 : blk.l === 2 ? 1.32 : 1.14) : fs;
      const lineH = isH ? size * 1.32 : lh;
      const left = mx + (blk.q ? fs * 1.4 : 0) + (blk.li ? fs * 0.4 : 0);
      const width = cw - (left - mx) - (blk.q ? fs * 0.8 : 0);
      const indent = !isH && !afterHeading && !blk.li && !blk.q ? fs * 1.4 : 0;
      if (isH) {
        if (chapterTop && page.ops.length === 0) y = top + (H - top) * 0.1;
        else { y += lineH * 0.9; if (y + lineH * 3 > bottom) newPage(bi, 0); }
      } else if ((blk.q || blk.li) && !afterHeading) y += lh * 0.15;

      // Words with their style; `sp` marks a space before the word, `br` a forced line break.
      const toks = [];
      let pendingSpace = false;
      for (const [text, st] of blk.r) {
        const f = font(blk.q ? st ^ ITALIC : st, size); // quotes are set in italic
        for (const part of text.split(/(\n| +)/)) {
          if (!part) continue;
          if (part === "\n") { toks.push({ br: true }); pendingSpace = false; continue; }
          if (/^ +$/.test(part)) { pendingSpace = true; continue; }
          toks.push({ s: part, f, w: measure(part, f), sp: pendingSpace });
          pendingSpace = false;
        }
      }
      const spaceW = measure(" ", font(0, size));
      let line = [], lw = 0, first = true;
      const emit = (justify) => {
        if (!line.length) { y += lineH * (first ? 0 : 1); return; }
        if (y + lineH > bottom) newPage(bi, line[0].i);
        const ind = first ? indent : 0, avail = width - ind;
        let gaps = 0, natural = 0;
        line.forEach((t, k) => { natural += t.w; if (k && t.sp) { natural += spaceW; gaps++; } });
        let extra = justify && !isH && gaps ? (avail - natural) / gaps : 0;
        if (extra > spaceW * 2.2) extra = 0;
        let x = isH ? left + Math.max(0, (width - natural) / 2) : left + ind;
        const base = y + (lineH - size) / 2 + size * 0.8;
        line.forEach((t, k) => {
          if (k && t.sp) x += spaceW + extra;
          page.ops.push({ k: "t", x, y: base, s: t.s, f: t.f, w: t.w, h: size });
          x += t.w;
        });
        y += lineH; first = false; line = []; lw = 0;
      };
      toks.forEach((t, i) => {
        if (t.br) { emit(false); return; }
        t.i = i;
        const add = (line.length && t.sp ? spaceW : 0) + t.w;
        if (line.length && lw + add > width - (first ? indent : 0)) { emit(true); line.push(t); lw = t.w; }
        else { line.push(t); lw += add; }
      });
      emit(false);
      if (isH) y += lineH * 0.55;
      afterHeading = isH; chapterTop = false;
    });
    if (pages.length > 1 && !pages[pages.length - 1].ops.length) pages.pop();
    return pages;
  }

  const locBefore = (a, b) => a.b < b.b || (a.b === b.b && a.w <= b.w);
  function pageForLoc(loc) {
    if (!loc || !R.pages) return 1;
    let p = 1;
    for (let i = 0; i < R.pages.length; i++) { if (locBefore(R.pages[i].start, loc)) p = i + 1; else break; }
    return p;
  }
  const currentLoc = () => (R.pages && R.pages[R.page - 1] ? R.pages[R.page - 1].start : null);

  function renderEpubPage(n, Wd, Hd) {
    const c = document.createElement("canvas"); c.width = Wd; c.height = Hd;
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, Wd, Hd);
    const s = Wd / R.pageW; x.scale(s, s);
    const pg = R.pages[n - 1];
    x.fillStyle = "#1C1C1C"; x.textBaseline = "alphabetic";
    let lastF = "";
    for (const op of pg.ops) {
      if (op.k === "t") { if (op.f !== lastF) { x.font = op.f; lastF = op.f; } x.fillText(op.s, op.x, op.y); }
      else if (op.k === "img") { const im = R.epubImgs.get(op.bi); if (im) x.drawImage(im, op.x, op.y, op.w, op.h); }
      else if (op.k === "hr") { x.fillStyle = "#9A9A9A"; x.font = `400 14px ${EPUB_FONT}`; lastF = ""; x.textAlign = "center"; x.fillText("⁂", R.pageW / 2, op.y); x.textAlign = "left"; x.fillStyle = "#1C1C1C"; }
    }
    x.fillStyle = "#A0A0A0"; x.font = `400 11px ${EPUB_FONT}`; x.textAlign = "center";
    x.fillText(String(n), R.pageW / 2, R.pageH - Math.round(clamp(R.pageH * 0.04, 16, 30)));
    return c;
  }

  async function renderCover(pdf) {
    const page = await pdf.getPage(1);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 320 / vp1.width });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    return new Promise((res) => c.toBlob(res, "image/jpeg", 0.82));
  }

  const uploadMsg = (e) => ({
    too_large: "File ini lebih dari 50 MB. Kompres dulu lalu coba lagi.",
    quota_or_state: "Penyimpanan rak sudah penuh. Hapus buku yang sudah selesai lalu coba lagi.",
    rate_limited: "Terlalu banyak unggahan sekaligus. Tunggu sebentar lalu coba lagi.",
    upstream_auth: "Sesi kamu sudah habis. Muat ulang halaman ini lalu coba lagi.",
    unsupported_type: "Format file ini tidak didukung.",
  }[e && (e.code || (String(e.statusCode) === "413" || /exceeded|too large/i.test(e.message || "") ? "too_large" : ""))] || "Unggahan gagal. Periksa koneksi lalu coba lagi.");

  let uploading = false;
  async function handleFile(file) {
    if (!file || uploading) return;
    const epub = isEpubFile(file);
    if (!epub && !isPdfFile(file)) return say("err", `"${file.name}" bukan PDF atau EPUB. Pilih file berakhiran .pdf atau .epub.`);
    if (!epub && !pdfjs) return say("err", "Pembaca PDF gagal dimuat. Muat ulang halaman ini.");
    if (epub && !window.JSZip) return say("err", "Pembaca EPUB gagal dimuat. Muat ulang halaman ini.");
    let title = cleanTitle(file.name.replace(/\.epub$/i, ""));
    const sync = !!(db && assets);
    if (!epub && sync && file.size > MAX_BYTES) return say("err", `${title} berukuran ${fmtMB(file.size)}, batasnya 50 MB per file. Kompres dulu PDF-nya lalu coba lagi.`);
    uploading = true;
    try {
      say("busy", `Membaca ${title}…`);
      let bytes, pages, cover = null, author = "";
      try {
        if (epub) {
          const r = await importEpub(file, (m) => say("busy", `${title}: ${m}`));
          ({ title, author, pages, cover } = r);
          bytes = new TextEncoder().encode(r.json);
        } else {
          bytes = new Uint8Array(await file.arrayBuffer());
          const pdf = await openPdf(bytes);
          pages = pdf.numPages;
          try { cover = await renderCover(pdf); } catch {}
          pdf.destroy();
        }
      } catch { return say("err", `${title} tidak bisa dibuka. Mungkin filenya rusak${epub ? " atau dikunci DRM" : " atau dikunci kata sandi"}.`); }
      const kind = epub ? "epub" : "pdf";

      if (!sync) {
        const id = "local-" + Date.now().toString(36);
        localBooks.set(id, { kind, title, author, pages, sizeBytes: file.size, addedAt: Date.now(), local: true, coverUrl: cover ? URL.createObjectURL(cover) : null });
        remember(id, bytes); renderLibrary(); showNewestRoom();
        say("ok", sb ? `${title} dibuka sementara di perangkat ini. Masuk dulu supaya bukunya tersimpan dan sinkron ke HP dan laptop.` : `${title} dibuka di perangkat ini saja.`);
        return;
      }
      if (bytes.length > MAX_BYTES) return say("err", `${title} terlalu besar setelah dibongkar (${fmtMB(bytes.length)}). Batasnya 50 MB.`);
      say("busy", `Mengunggah ${title}…`);
      try {
        const blob = epub ? new Blob([bytes], { type: "application/json" }) : file;
        const { filePath } = await cloud.addBook({ kind, title, author, pages, sizeBytes: file.size }, blob, epub ? "application/json" : "application/pdf", cover);
        remember(filePath, bytes); idb.put(filePath, bytes);
        await refresh(); showNewestRoom();
        say("ok", `${title} masuk rak. Buka Rak Baca di perangkat lain, bukunya sudah ada di sana.`);
      } catch (e) { say("err", uploadMsg(e)); }
    } finally { uploading = false; $("#file").value = ""; }
  }

  $("#file").addEventListener("change", (e) => handleFile(e.target.files[0]));
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { if (!$("#reader").hidden) return; e.preventDefault(); drop.hidden = false; }));
  ["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); if (t === "dragleave" && e.relatedTarget) return; drop.hidden = true; }));
  document.addEventListener("drop", (e) => { if ($("#reader").hidden && e.dataTransfer?.files?.[0]) handleFile(e.dataTransfer.files[0]); });

  // ---------- reader ----------
  const stage = $("#stage"), bookEl = $("#book"), cR = $("#cR");
  let fx = $("#fx");
  const R = {
    id: null, book: null, pdf: null, n: 0, page: 1, ar: 0.707,
    pageW: 0, pageH: 0, pageX: 0, pageY: 0, stageW: 0, stageH: 0, dpr: 1,
    cache: new Map(), tick: 0, flip: null,
    savedPage: 0, savedId: null, writing: false, again: false, openedAt: 0, toastFor: 0, wake: null,
    zoom: 1, panX: 0, panY: 0, fontScale: lsGet("epubFont") || 1,
  };
  const cssVar = (name, fb) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb;
  function hexRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex); const v = m ? parseInt(m[1], 16) : 0xF1EFEA;
    return [(v >> 16 & 255) / 255, (v >> 8 & 255) / 255, (v & 255) / 255];
  }

  function rload(text, err) {
    const el = $("#rload");
    el.hidden = !text; el.textContent = text || "";
    if (err) el.dataset.err = ""; else delete el.dataset.err;
  }

  async function fetchWithProgress(url, onp) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const total = +r.headers.get("content-length") || 0;
    if (!r.body || !total) return new Uint8Array(await r.arrayBuffer());
    const reader = r.body.getReader(), chunks = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; onp(Math.min(99, Math.round((got / total) * 100))); }
    const out = new Uint8Array(got); let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }

  async function openBook(id) {
    const b = books.get(id) || localBooks.get(id);
    if (!b) return;
    const epub = b.kind === "epub";
    if (!epub && !pdfjs) return say("err", "Pembaca PDF gagal dimuat. Muat ulang halaman ini.");
    if (R.pdf) { R.pdf.destroy(); R.pdf = null; }
    Object.assign(R, { id, book: b, kind: epub ? "epub" : "pdf", n: 0, flip: null, openedAt: Date.now(), toastFor: 0, pages: null, epub: null, epubImgs: null, zoom: 1, panX: 0, panY: 0 });
    setZoomLabels();
    R.cache.clear(); pdfLines.clear(); closeWord(); fx.hidden = true; $("#toast").hidden = true;
    $("#library").hidden = true; $("#reader").hidden = false; $("#reader").classList.remove("calm");
    $("#rTitle").textContent = b.title;
    bookEl.style.visibility = "hidden";
    rload(`Membuka ${b.title}…`);
    try {
      const key = b.local ? id : b.fileId;
      let bytes = memBytes.get(key) || (b.local ? null : await idb.get(key));
      if (!bytes) {
        bytes = await fetchWithProgress(await cloud.fileUrl(b), (p) => { if (R.id === id) rload(`Mengambil buku… ${p}%`); });
        idb.put(key, bytes);
      }
      remember(key, bytes);
      if (R.id !== id) return;
      if (epub) {
        const book = JSON.parse(new TextDecoder().decode(bytes));
        const imgs = new Map();
        await Promise.all(book.blocks.map(async (blk, i) => {
          if (blk.t !== "img") return;
          const im = new Image(); im.src = blk.src;
          try { await im.decode(); imgs.set(i, im); } catch {}
        }));
        await loadBookFonts();
        if (R.id !== id) return;
        // For an EPUB the "document" is the typeset book; destroy() keeps it interchangeable with a pdf.js document.
        R.epub = book; R.epubImgs = imgs; R.pdf = { destroy() {} };
        layout(true);
        const pr = getProg(id);
        R.page = pr?.loc ? pageForLoc(pr.loc) : (pr?.page && pr?.total ? clamp(Math.round((pr.page / pr.total) * R.n), 1, R.n) : 1);
        R.savedPage = R.page; R.savedId = id;
        rload(null); renderStatic();
        bookEl.style.visibility = "";
        try { R.wake = await navigator.wakeLock?.request("screen"); } catch {}
        return;
      }
      const pdf = await openPdf(bytes);
      if (R.id !== id) { pdf.destroy(); return; }
      const vp = (await pdf.getPage(1)).getViewport({ scale: 1 });
      R.pdf = pdf; R.n = pdf.numPages; R.ar = vp.width / vp.height;
      R.page = clamp(getProg(id)?.page || 1, 1, R.n);
      R.savedPage = R.page; R.savedId = id;
      $("#slider").max = R.n;
      R.zoom = clamp(lsGet("zoom:" + id) || 1, 1, ZOOM_MAX);
      rload(null); layout(true); renderStatic();
      bookEl.style.visibility = "";
      try { R.wake = await navigator.wakeLock?.request("screen"); } catch {}
    } catch (e) {
      if (R.id === id) rload(navigator.onLine === false ? "Buku ini belum pernah dibuka di perangkat ini, jadi butuh internet sekali untuk mengunduhnya." : "Buku ini tidak bisa dibuka. Kembali ke rak lalu coba lagi.", true);
    }
  }

  function closeReader() {
    saveProgress();
    closeWord();
    R.id = null; R.flip = null; fx.hidden = true;
    if (R.pdf) { R.pdf.destroy(); R.pdf = null; }
    R.cache.clear(); FX.forget();
    try { R.wake?.release(); } catch {}
    R.wake = null;
    $("#reader").hidden = true; $("#library").hidden = false;
    renderLibrary();
  }

  // One page, centred on the desk, as large as the screen allows.
  function layout(force) {
    if (!R.pdf) return false;
    const r = stage.getBoundingClientRect();
    const pad = r.width < 600 ? 10 : 24;
    const W = Math.max(120, r.width - pad * 2), H = Math.max(120, r.height - pad * 2);
    if (R.kind === "epub") R.ar = clamp(W / H, 0.56, 0.74); // EPUB pages take the screen's shape
    let pw = Math.min(W, H * R.ar);
    const ph = Math.floor(pw / R.ar); pw = Math.floor(pw);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const sw = Math.round(r.width), sh = Math.round(r.height);
    if (!force && pw === R.pageW && ph === R.pageH && dpr === R.dpr && sw === R.stageW && sh === R.stageH) return false;
    Object.assign(R, { pageW: pw, pageH: ph, dpr, stageW: sw, stageH: sh, pageX: Math.round((sw - pw) / 2), pageY: Math.round((sh - ph) / 2) });
    R.cache.clear(); FX.forget(); closeWord();
    Object.assign(bookEl.style, { left: R.pageX + "px", top: R.pageY + "px", width: pw + "px", height: ph + "px" });
    cR.width = pw * dpr; cR.height = ph * dpr;
    fx.width = sw * dpr; fx.height = sh * dpr;
    if (R.kind === "epub" && R.epub) {
      const loc = currentLoc();
      R.pages = typesetEpub(R.epub, pw, ph);
      R.n = R.pages.length;
      R.page = loc ? pageForLoc(loc) : 1;
      $("#slider").max = R.n;
    }
    applyZoom();
    return true;
  }

  function getRendered(n) {
    let e = R.cache.get(n);
    if (e) { e.used = ++R.tick; return e.promise; }
    const W = R.pageW * R.dpr, H = R.pageH * R.dpr, pdf = R.pdf;
    e = { used: ++R.tick, canvas: null };
    if (R.kind === "epub") {
      e.canvas = renderEpubPage(n, W, H);
      e.promise = Promise.resolve(e.canvas);
      R.cache.set(n, e);
      return e.promise;
    }
    e.promise = pdf.getPage(n).then(async (page) => {
      const vp1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(W / vp1.width, H / vp1.height) });
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
      await page.render({ canvasContext: ctx, viewport: vp, transform: [1, 0, 0, 1, (W - vp.width) / 2, (H - vp.height) / 2] }).promise;
      e.canvas = c; return c;
    });
    e.promise.catch(() => { if (R.cache.get(n) === e) R.cache.delete(n); });
    R.cache.set(n, e);
    if (R.cache.size > 8) {
      const old = [...R.cache.entries()].sort((a, b) => a[1].used - b[1].used);
      for (const [k] of old.slice(0, R.cache.size - 8)) R.cache.delete(k);
    }
    return e.promise;
  }

  function paint(cv, n) {
    const tok = (cv._tok = (cv._tok || 0) + 1);
    const ctx = cv.getContext("2d");
    const e = R.cache.get(n);
    if (e && e.canvas) { e.used = ++R.tick; ctx.drawImage(e.canvas, 0, 0, cv.width, cv.height); return; }
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    getRendered(n).then((c) => { if (cv._tok === tok) ctx.drawImage(c, 0, 0, cv.width, cv.height); }).catch(() => {});
  }

  function renderStatic() {
    if (!R.pdf) return;
    paint(cR, R.page);
    fx.hidden = true;
    updateUI();
    if (R.zoom > 1) sharpenSoon();
    for (const n of [R.page + 1, R.page - 1, R.page + 2]) if (n >= 1 && n <= R.n) getRendered(n).catch(() => {});
  }

  function updateUI() {
    $("#pageno").textContent = `${R.page} / ${R.n}`;
    $("#slider").value = R.page;
    $("#prev").disabled = !canGo(-1);

    const mark = $("#wordMark");
    Object.assign(mark.style, { left: hit.x + "px", top: hit.y + "px", width: hit.w + "px", height: hit.h + "px" });
    mark.hidden = false;
    const mr = mark.getBoundingClientRect(), mx = mr.left + mr.width / 2;
    const title = h("p", { class: "wb-word", text: hit.text.replace(/^['’-]+|['’-]+$/g, "") });
    fillWordbox([title, h("p", { class: "wb-note", text: "Mencari arti…" })], mx, cy, mr.bottom, mr.top);
    let found;
    try { found = await lookUp(word); }
    catch {
      if (tok === wordTok) fillWordbox([title, h("p", { class: "wb-note", text: "Kata ini butuh internet sekali untuk mengambil artinya. Coba lagi saat tersambung." })], mx, cy, mr.bottom, mr.top);
      return;
    }
    if (tok !== wordTok) return;
    if (!found.length) return fillWordbox([title, h("p", { class: "wb-note", text: "Tidak ada di kamus. Kamus ini berbahasa Inggris dan jarang memuat nama orang atau kata gaul." })], mx, cy, mr.bottom, mr.top);
    const kids = [title];
    for (const { lemma, rows } of found) {
      if (lemma !== word) kids.push(h("p", { class: "wb-from", text: "bentuk dari " + lemma }));
      else if (found.length > 1) kids.push(h("p", { class: "wb-from", text: word }));
      let list = null, pos = null;
      for (const [p, def, ex] of rows) {
        if (p !== pos) { pos = p; list = h("ol", { class: "wb-list" }); kids.push(h("p", { class: "wb-pos", text: POS_NAMES[p] || p }), list); }
        const li = h("li", { text: def });
        if (ex) li.append(h("span", { class: "wb-ex", text: ex }));
        list.append(li);
      }
    }
    fillWordbox(kids, mx, cy, mr.bottom, mr.top);
    $("#wordbox").scrollTop = 0;
  }
  $("#wbClose").addEventListener("click", closeWord);
  document.addEventListener("pointerdown", (e) => { if (!e.opensWord && !$("#wordbox").hidden && !e.target.closest("#wordbox")) closeWord(); }); // the press that opens the box also ends up here
  stage.addEventListener("contextmenu", (e) => e.preventDefault()); // holding a word shouldn't open the browser's menu

  // ---------- page turning ----------
  // A flip curls page `curl` away to reveal `under`. p = 0: curl page lies flat; p = 1: fully turned.
  // Going forward turns the current page (p 0 -> 1); going back un-turns the previous one (p 1 -> 0).
  function startFlip(dir, gy) {
    if (R.flip || !canGo(dir)) return false;
    closeWord();
    R.flip = dir > 0
      ? { dir, curl: R.page, under: R.page + 1, p: 0, gy, fy: 0, anim: 0, target: R.page + 1 }
      : { dir, curl: R.page - 1, under: R.page, p: 1, gy, fy: 0, anim: 0, target: R.page - 1 };
    FX.draw(R.flip); fx.hidden = false;
    return true;
  }
  function animateTo(goal, lift, done) {
    const f = R.flip; if (!f) return;
    const p0 = f.p, fy0 = f.fy, t0 = performance.now();
    const dur = reduced ? 0 : 220 + 620 * Math.abs(goal - p0);
    const id = ++f.anim;
    const step = (now) => {
      if (R.flip !== f || f.anim !== id) return;
      const k = dur ? Math.min(1, (now - t0) / dur) : 1;
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      f.p = p0 + (goal - p0) * e;
      f.fy = fy0 * (1 - e) + (lift ? -R.pageH * 0.14 * Math.sin(Math.PI * e) : 0);
      FX.draw(f);
      if (k < 1) requestAnimationFrame(step); else done();
    };
    requestAnimationFrame(step);
  }
  function finishFlip() { const f = R.flip; R.flip = null; R.page = f.target; renderStatic(); saveSoon(); }
  function cancelFlip() { R.flip = null; renderStatic(); }
  function go(dir) {
    if (R.flip) return;
    if (R.zoom > 1) {
      if (canGo(dir)) { closeWord(); R.page += dir; R.panY = 0; applyZoom(); renderStatic(); saveSoon(); }
      return;
    }
    if (startFlip(dir, R.pageH * 0.92)) animateTo(dir > 0 ? 1 : 0, true, finishFlip);
    else nudge();
  }
  function nudge() { bookEl.classList.remove("edgehint"); void bookEl.offsetWidth; bookEl.classList.add("edgehint"); }
  function jump(p) { if (R.flip || !R.pdf) return; closeWord(); R.page = clamp(p, 1, R.n); renderStatic(); saveSoon(); }

  const HOLD_MS = 480, DOUBLE_CLICK_MS = 230;
  let drag = null, pinchR = null, pendingTap = null;
  const fingers = new Map();
  const fingerSpread = () => {
    const [a, b] = [...fingers.values()], r = stage.getBoundingClientRect();
    return { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, mx: (a[0] + b[0]) / 2 - r.left, my: (a[1] + b[1]) / 2 - r.top };
  };
  stage.addEventListener("pointerdown", (e) => {
    if (!R.pdf || e.button > 0) return;
    if (!$("#wordbox").hidden) return; // this press only closes the box (handled on document)
    if (pendingTap && e.pointerType === "mouse") {
      const near = Math.hypot(e.clientX - pendingTap.x, e.clientY - pendingTap.y) < 8;
      clearTimeout(pendingTap.timer);
      const tap = pendingTap; pendingTap = null;
      if (near) { e.opensWord = true; showWordAt(e.clientX, e.clientY); return; }
      tap.run();
    }
    fingers.set(e.pointerId, [e.clientX, e.clientY]);
    try { stage.setPointerCapture(e.pointerId); } catch {}
    if (fingers.size === 2) {
      // A second finger turns whatever the first one started into a pinch.
      if (drag?.started && R.flip) cancelFlip();
      clearTimeout(drag?.hold);
      drag = null;
      if (!R.flip) pinchR = { d0: fingerSpread().d, zoom0: R.zoom, ratio: 1 };
      return;
    }
    if (R.flip || fingers.size > 2) return;
    drag = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, pan: R.zoom > 1, started: false, moved: false, samples: [[e.clientX, performance.now()]] };
    const held = drag;
    drag.hold = setTimeout(() => {
      if (drag !== held || held.moved || held.started || pinchR) return;
      drag = null;
      if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(12); // browsers refuse it before the first tap
      showWordAt(held.x0, held.y0);
    }, HOLD_MS);
  });
  stage.addEventListener("pointermove", (e) => {
    if (fingers.has(e.pointerId)) fingers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinchR) {
      if (fingers.size < 2) return;
      const { d, mx, my } = fingerSpread();
      pinchR.ratio = d / pinchR.d0;
      if (R.kind === "pdf") zoomAt(pinchR.zoom0 * pinchR.ratio, mx, my);
      else $("#zoomVal").textContent = Math.round(clamp(R.fontScale * pinchR.ratio, FONT_STEPS[0], FONT_STEPS[FONT_STEPS.length - 1]) * 100) + "%";
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    drag.samples.push([e.clientX, performance.now()]); if (drag.samples.length > 6) drag.samples.shift();
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) drag.moved = true;
    if (drag.pan) {
      R.panX += e.clientX - drag.lx; R.panY += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      applyZoom();
      return;
    }
    if (!drag.started && !drag.blocked && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      const dir = dx < 0 ? 1 : -1;
      const sr = stage.getBoundingClientRect();
      const gy = clamp(drag.y0 - sr.top - R.pageY, R.pageH * 0.06, R.pageH * 0.94);
      if (startFlip(dir, gy)) { drag.started = true; drag.dir = dir; } else { drag.blocked = true; nudge(); }
    }
    if (drag.started && R.flip) {
      const span = (2 * R.pageW) / 1.5;
      R.flip.p = clamp(drag.dir > 0 ? -dx / span : 1 - dx / span, 0, 1);
      R.flip.fy = clamp(dy * 0.9, -R.pageH * 0.5, R.pageH * 0.5);
      FX.draw(R.flip);
    }
  });
  const endDrag = (e, cancelled) => {
    fingers.delete(e.pointerId);
    if (pinchR) {
      if (fingers.size >= 2) return;
      const p = pinchR; pinchR = null; drag = null;
      if (R.kind === "pdf") sharpenSoon();
      else {
        // The pages only reflow when the fingers let go; settle on the nearest size.
        const want = R.fontScale * p.ratio;
        setFont(FONT_STEPS.reduce((a, b) => (Math.abs(b - want) < Math.abs(a - want) ? b : a)));
        updateZoomUI();
      }
      return;
    }
    if (!drag) return;
    const d = drag; drag = null;
    clearTimeout(d.hold);
    if (d.started && R.flip) {
      const [x1, t1] = d.samples[0], v = (e.clientX - x1) / Math.max(1, performance.now() - t1); // px/ms
      const toward = d.dir > 0 ? -v : v;
      const done = d.dir > 0 ? R.flip.p : 1 - R.flip.p;
      const complete = !cancelled && toward > -0.3 && (done > 0.22 || toward > 0.4);
      const goal = complete === (d.dir > 0) ? 1 : 0;
      animateTo(goal, false, complete ? finishFlip : cancelFlip);
    } else if (!d.moved && !cancelled) {
      const r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
      const run = () => { if (x > 0.66) go(1); else if (x < 0.34) go(-1); else $("#reader").classList.toggle("calm"); };
      // A mouse click waits a moment in case it's the first half of a double-click on a word.
      if (e.pointerType === "mouse") pendingTap = { x: e.clientX, y: e.clientY, run, timer: setTimeout(() => { pendingTap = null; run(); }, DOUBLE_CLICK_MS) };
      else run();
    }
  };
  stage.addEventListener("pointerup", (e) => endDrag(e, false));
  stage.addEventListener("pointercancel", (e) => endDrag(e, true));

  $("#prev").addEventListener("click", () => go(-1));
  $("#next").addEventListener("click", () => go(1));
  $("#slider").addEventListener("input", (e) => { $("#pageno").textContent = `${e.target.value} / ${R.n}`; });
  $("#slider").addEventListener("change", (e) => jump(+e.target.value));
  $("#back").addEventListener("click", closeReader);
  document.addEventListener("keydown", (e) => {
    if ($("#reader").hidden || e.target.tagName === "INPUT") return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
    else if (e.key === "Escape") { if (!$("#wordbox").hidden) closeWord(); else closeReader(); }
    else if (!e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === "+" || e.key === "=") zoomStep(1);
      else if (e.key === "-") zoomStep(-1);
      else if (e.key === "0") zoomReset();
    }
  });
  let rsz;
  window.addEventListener("resize", () => {
    clearTimeout(rsz);
    rsz = setTimeout(() => { if (R.pdf && !R.flip && layout(false)) renderStatic(); }, 120);
  });
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "hidden") saveProgress();
    else if (R.pdf && !R.wake) { try { R.wake = await navigator.wakeLock?.request("screen"); } catch {} }
  });

  // ---------- reading progress ----------
  let saveTimer;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveProgress, 800); }
  async function saveProgress() {
    clearTimeout(saveTimer);
    if (!R.id || !R.n) return;
    const id = R.id, body = { page: R.page, total: R.n, updatedAt: Date.now(), device: DEVICE, session: SESSION };
    const loc = R.kind === "epub" ? currentLoc() : null;
    if (loc) body.loc = { b: loc.b, w: loc.w };
    if (R.savedId === id && R.savedPage === body.page) return;
    lsSet("prog:" + id, body);
    if (!db || !uid || R.book?.local) { R.savedPage = body.page; R.savedId = id; return; }
    if (R.writing) { R.again = true; return; }
    R.writing = true;
    try { await cloud.saveProgress(id, body); R.savedPage = body.page; R.savedId = id; setSync("ok"); }
    catch { setSync("err"); }
    finally {
      R.writing = false;
      if (R.again) { R.again = false; if (R.id === id && R.page !== R.savedPage) saveProgress(); }
    }
  }
  // Another device moved ahead while this one is open: offer to jump there.
  function checkRemote() {
    if (!R.pdf || !R.id) return;
    const pr = progress.get(R.id);
    if (!pr || pr.session === SESSION || pr.updatedAt <= R.openedAt || R.toastFor === pr.updatedAt) return;
    const epub = R.kind === "epub";
    const target = epub ? (pr.loc ? pageForLoc(pr.loc) : clamp(Math.round((pr.page / (pr.total || 1)) * R.n), 1, R.n)) : pr.page;
    if (target === R.page) return;
    R.toastFor = pr.updatedAt;
    const t = $("#toast");
    const where = epub ? `${Math.round((pr.page / (pr.total || 1)) * 100)}%` : `hal. ${pr.page}`;
    $("#toastText").textContent = `Di ${pr.device || "perangkat lain"} kamu sudah sampai ${where}.`;
    $("#toastBtn").textContent = "Lompat ke sana";
    $("#toastBtn").onclick = () => { t.hidden = true; jump(target); };
    t.hidden = false;
    clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 9000);
  }
  // Android back button (APK): close the reader or the book panel first, then leave the app.
  const capApp = window.Capacitor?.Plugins?.App;
  if (capApp) capApp.addListener("backButton", () => {
    if (!$("#wordbox").hidden) closeWord();
    else if (!$("#reader").hidden) closeReader();
    else if (scene.sel) closeSheet();
    else capApp.exitApp();
  });
  // In a browser, cache the app itself so it opens offline and can be installed to the home screen.
  if ("serviceWorker" in navigator && !window.Capacitor?.isNativePlatform?.() && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
