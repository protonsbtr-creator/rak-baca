<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Rak Baca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&display=swap">
<style>
/* Layout: quiet monochrome. A header row, then a grid of book covers like a shelf; the reader is a soft grey room with one white page. */
:root {
  --bg: #FFFFFF;
  --surface: #F6F6F6;
  --ink: #141414;
  --muted: #7A7A7A;
  --faint: #A8A8A8;
  --line: #E6E6E6;
  --accent: #141414;
  --accent-ink: #FFFFFF;
  --accent-soft: #F1F1F1;
  --danger: #C4372F;
  --desk: #EDEDED;
  --desk-2: #F4F4F4;
  --desk-ink: #1A1A1A;
  --desk-muted: #8A8A8A;
  --desk-hover: rgba(0, 0, 0, .06);
  --page-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 12px 32px rgba(0, 0, 0, .10);
  --cover-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 8px 20px rgba(0, 0, 0, .08);
  --paper: #FFFFFF;
  --paper-back: #F3F3F3;
  --shade: rgba(0, 0, 0, 0.14);
  --wall-top: #FFFFFF; --wall: #EFEFEF; --floor-far: #E4E4E4; --floor-near: #F7F7F7; --grid: rgba(0, 0, 0, .06); --dust: 90, 90, 90; --floor-shadow: 0, 0, 0;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #1A1A1A; --ink: #EDEDED; --muted: #8E8E8E; --faint: #5E5E5E; --line: #262626;
    --accent: #EDEDED; --accent-ink: #111111; --accent-soft: #1F1F1F; --danger: #EF6F67;
    --desk: #161616; --desk-2: #1C1C1C; --desk-ink: #E6E6E6; --desk-muted: #8A8A8A; --desk-hover: rgba(255, 255, 255, .07);
    --page-shadow: 0 12px 36px rgba(0, 0, 0, .5); --cover-shadow: 0 8px 22px rgba(0, 0, 0, .45);
    --paper-back: #EAEAEA; --shade: rgba(0, 0, 0, 0.4);
    --wall-top: #262626; --wall: #151515; --floor-far: #1D1D1D; --floor-near: #0E0E0E; --grid: rgba(255, 255, 255, .05); --dust: 200, 200, 200; --floor-shadow: 0, 0, 0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #1A1A1A; --ink: #EDEDED; --muted: #8E8E8E; --faint: #5E5E5E; --line: #262626;
  --accent: #EDEDED; --accent-ink: #111111; --accent-soft: #1F1F1F; --danger: #EF6F67;
  --desk: #161616; --desk-2: #1C1C1C; --desk-ink: #E6E6E6; --desk-muted: #8A8A8A; --desk-hover: rgba(255, 255, 255, .07);
  --page-shadow: 0 12px 36px rgba(0, 0, 0, .5); --cover-shadow: 0 8px 22px rgba(0, 0, 0, .45);
  --paper-back: #EAEAEA; --shade: rgba(0, 0, 0, 0.4);
    --wall-top: #262626; --wall: #151515; --floor-far: #1D1D1D; --floor-near: #0E0E0E; --grid: rgba(255, 255, 255, .05); --dust: 200, 200, 200; --floor-shadow: 0, 0, 0;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, label { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- Library ---------- */
#library { max-width: 1040px; margin: 0 auto; padding-inline: 24px; padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 36px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-weight: 600; font-size: 20px; letter-spacing: -0.02em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.chip[data-s="ok"]::before { background: #3BA55C; }
.chip[data-s="err"]::before { background: var(--danger); }

.who { color: var(--muted); font-size: 13px; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auth { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 14px 24px; align-items: center; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.auth-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.auth-copy strong { font-weight: 500; font-size: 15px; }
.auth-copy span { color: var(--muted); font-size: 13.5px; }
.auth-fields { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.auth input { flex: 1 1 150px; min-width: 0; min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; }
.auth-switch { grid-column: 1 / -1; margin: 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
@media (max-width: 560px) { .auth { grid-template-columns: 1fr; } }
.say { margin: -20px 0 0; font-size: 13px; color: var(--muted); }
.say[data-k="err"] { color: var(--danger); }
.say[data-k="busy"]::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; vertical-align: -1px; border: 1.5px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap; transition: opacity .15s, background .15s; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { opacity: .85; }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
.btn.ghost:hover { color: var(--ink); }
.btn.danger { background: var(--danger); color: #FFFFFF; }
.btn.sm { min-height: 30px; padding: 0 12px; font-size: 13px; }

.shelfhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.shelfhead h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
#count { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 40px 20px; padding-top: 8px; }
.item { --w: min(124px, 33vw); display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }

/* A floating 3D book: a CSS box (cover, spine, page block, top, back) tilted to show its spine, bobbing on a loop. */
.b3 { --h: calc(var(--w) * 1.42); --t: 20px; --spine: #2B2B2B; --spine-ink: #FFFFFF; position: relative; width: var(--w); height: var(--h); margin-block: 10px 22px; padding: 0; border: 0; background: none; cursor: pointer; perspective: 900px; animation: arrive .9s cubic-bezier(.2, .9, .25, 1.15) both; animation-delay: var(--in, 0s); }
.b3:focus-visible { outline: none; }
.b3 .float { position: absolute; inset: 0; transform-style: preserve-3d; animation: bob var(--dur, 6s) ease-in-out var(--phase, 0s) infinite; }
.b3 .body { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(5deg) rotateY(var(--tilt, 28deg)); transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
.b3:hover .body, .b3:focus-visible .body { transform: rotateX(0deg) rotateY(8deg) translateZ(22px); }
.b3 .f { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.b3 .front { inset: 0; transform: translateZ(calc(var(--t) / 2)); border-radius: 1px 3px 3px 1px; overflow: hidden; background: var(--surface); }
.b3 .front img { width: 100%; height: 100%; object-fit: cover; display: block; }
.b3 .front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(0, 0, 0, .18), rgba(255, 255, 255, .08) 4%, transparent 9%), linear-gradient(115deg, rgba(255, 255, 255, .22), transparent 40%); }
.b3 .ph { display: grid; place-items: center; width: 100%; height: 100%; padding: 12px; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--surface); text-align: center; }
.b3 .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ink); z-index: 1; }
.b3 .back { inset: 0; transform: rotateY(180deg) translateZ(calc(var(--t) / 2)); background: var(--spine); border-radius: 3px 1px 1px 3px; }
.b3 .spine { top: 0; left: calc(50% - var(--t) / 2); width: var(--t); height: 100%; transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); background: linear-gradient(to right, rgba(0, 0, 0, .25), rgba(255, 255, 255, .10) 45%, rgba(0, 0, 0, .18)), var(--spine); color: var(--spine-ink); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.b3 .spine span { writing-mode: vertical-rl; font-size: 9.5px; font-weight: 500; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 86%; opacity: .9; }
.b3 .pages { top: 2px; left: calc(50% - var(--t) / 2 + 1px); width: calc(var(--t) - 2px); height: calc(100% - 4px); transform: rotateY(90deg) translateZ(calc(var(--w) / 2 - 3px)); background: repeating-linear-gradient(to right, #F7F7F7 0 1px, #DADADA 1px 2px); }
.b3 .top { left: 0; top: calc(50% - var(--t) / 2 + 1px); width: calc(100% - 3px); height: calc(var(--t) - 2px); transform: rotateX(90deg) translateZ(calc(var(--h) / 2 - 2px)); background: repeating-linear-gradient(#F7F7F7 0 1px, #DCDCDC 1px 2px); }
.b3 .shadow { position: absolute; left: 8%; right: 8%; bottom: -26px; height: 14px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .22), transparent); animation: shadow var(--dur, 6s) ease-in-out var(--phase, 0s) infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotateZ(0deg); } 50% { transform: translateY(-12px) rotateZ(-1.2deg); } }
@keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.8); opacity: .55; } }
@keyframes arrive { from { opacity: 0; transform: translateY(-70px) rotate(-6deg) scale(.9); } to { opacity: 1; transform: none; } }
.b3.seen { animation: none; }
.info { display: flex; flex-direction: column; gap: 3px; min-width: 0; width: calc(var(--w) + 24px); }
.info h3 { margin: 0; font-weight: 500; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub { margin: 0; color: var(--muted); font-size: 12.5px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.where { margin: 0; color: var(--faint); font-size: 12.5px; }
.del { display: inline-grid; place-items: center; width: 28px; height: 28px; margin: -4px -6px -4px 0; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; flex: none; }
.del:hover { color: var(--ink); background: var(--surface); }
.del svg { width: 15px; height: 15px; }
.confirm { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.confirm p { margin: 0; font-size: 12.5px; color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 56px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; cursor: pointer; }
.empty strong { color: var(--ink); font-weight: 500; font-size: 16px; }
.empty span { max-width: 42ch; font-size: 14px; }
.loadingShelf { color: var(--faint); font-size: 14px; }
.dropzone { position: fixed; inset: 12px; z-index: 20; display: grid; place-items: center; border: 1.5px dashed var(--ink); border-radius: 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); font-size: 16px; font-weight: 500; pointer-events: none; }

/* ---------- Reader ---------- */
#reader { position: fixed; inset: 0; z-index: 10; background: var(--desk); color: var(--desk-ink); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.rbar { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 12px; transition: opacity .2s, transform .2s; }
.rbar.bottom { gap: 12px; padding-bottom: 12px; }
#reader.calm .rbar { opacity: 0; pointer-events: none; }
#reader.calm .rbar.topbar { transform: translateY(-8px); }
#reader.calm .rbar.bottom { transform: translateY(8px); }
.ibtn { display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: transparent; color: var(--desk-ink); cursor: pointer; }
.ibtn:hover { background: var(--desk-hover); }
.ibtn:disabled { opacity: .25; cursor: default; background: transparent; }
.ibtn svg { width: 20px; height: 20px; }
.rtitle { flex: 1; min-width: 0; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pageno { font-family: var(--f-mono); font-size: 12.5px; color: var(--desk-muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 7ch; text-align: right; }
#slider { flex: 1; min-width: 0; accent-color: var(--desk-ink); height: 28px; }

#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#book { position: absolute; background: var(--paper); box-shadow: var(--page-shadow); }
#book canvas { display: block; width: 100%; height: 100%; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

.rload { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--desk-muted); font-size: 14px; }
.rload[data-err] { color: var(--desk-ink); }
.toast { position: absolute; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 8px 8px 8px 16px; border-radius: 999px; background: var(--bg); color: var(--ink); box-shadow: 0 8px 28px rgba(0, 0, 0, .16); font-size: 13.5px; }
.toast .btn { min-height: 32px; }
.edgehint { animation: nudge .35s ease; }
@keyframes nudge { 30% { transform: translateX(-10px); } 70% { transform: translateX(6px); } }

@media (max-width: 560px) {
  #library { padding-inline: 16px; padding-block: 20px 48px; gap: 28px; }
  #library #space { --w: 84px; }
  .brand p { display: none; }
  .sheet-card { grid-template-columns: 64px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .rbar, .btn { transition: none; }
  .sheet-card { animation: none; }
}

/* ---------- weightless scene ---------- */
/* The room: a softly lit back wall, a floor with a perspective grid fading into the horizon, drifting dust. */
#room { position: relative; width: 100vw; margin-inline: calc(50% - 50vw); overflow: hidden; background: var(--wall); }
#libbg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.fs { position: absolute; left: 0; top: 0; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--floor-shadow), .55), rgba(var(--floor-shadow), 0)); pointer-events: none; will-change: transform, opacity; opacity: 0; }
#space { --w: 112px; position: relative; max-width: 1100px; margin-inline: auto; perspective: 1500px; perspective-origin: 50% 40%; transition: height .6s ease; }
#space .b3 { touch-action: none; cursor: grab; position: absolute; left: 0; top: 0; margin: 0; perspective: none; transform-style: preserve-3d; animation: none; will-change: transform, opacity; opacity: 0; }
#space .b3 .body { transform: none; transition: none; }
.b3 .cap { position: absolute; left: 50%; top: calc(100% + 16px); transform: translateX(-50%); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); opacity: 0; transition: opacity .2s; pointer-events: none; }
.b3:hover .cap { opacity: 1; }
.gesture { margin: 14px 0 0; text-align: center; font-size: 12.5px; color: var(--faint); }

.sheet { position: fixed; inset: 0; z-index: 15; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-card { position: relative; display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 16px; width: min(460px, 100%); padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 64px rgba(0, 0, 0, .14); animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.sheet-cover { aspect-ratio: 0.7; border-radius: 3px; overflow: hidden; background: var(--surface); box-shadow: var(--cover-shadow); align-self: start; }
.sheet-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet-cover .ph { display: grid; place-items: center; height: 100%; padding: 6px; font-size: 11px; color: var(--muted); text-align: center; }
.sheet-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding-right: 26px; }
.sheet-info h3 { margin: 0; font-weight: 500; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.sheet .bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; margin-block: 2px; }
.sheet .bar span { display: block; height: 100%; background: var(--ink); }
.sheet .row { margin-top: 6px; }
.sheet .close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; }
.sheet .close:hover { background: var(--surface); color: var(--ink); }
</style>
</head>
<body>


<div id="library">
  <header class="top">
    <div class="brand">
      <h1>Rak Baca</h1>
      <p>Lanjut dari halaman terakhir, di HP maupun laptop.</p>
    </div>
    <div class="tools">
      <span id="sync" class="chip" data-s="wait">Menghubungkan…</span>
      <span id="account" class="who" hidden></span>
      <button class="btn ghost sm" id="logout" hidden>Keluar</button>
      <label class="btn primary" for="file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Unggah buku</label>
      <input type="file" id="file" accept="application/pdf,.pdf,application/epub+zip,.epub" hidden>
    </div>
  </header>
  <form id="auth" class="auth" hidden>
    <div class="auth-copy">
      <strong>Masuk untuk sinkron</strong>
      <span>Buku dan halaman terakhirmu tersimpan di akun, jadi HP dan laptop selalu nyambung.</span>
    </div>
    <div class="auth-fields">
      <input id="email" type="email" autocomplete="email" placeholder="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Kata sandi" minlength="6" required>
      <button class="btn primary" id="authGo" type="submit">Masuk</button>
    </div>
    <p class="auth-switch"><span id="authMsg" aria-live="polite"></span><button type="button" class="link" id="authMode">Belum punya akun? Daftar</button></p>
  </form>
  <p id="say" class="say" hidden></p>

  <section>
    <div class="shelfhead"><h2>Rak kamu</h2><div class="tools"><button class="btn ghost sm" id="tidy" hidden>Rapikan</button><span id="count"></span></div></div>
    <div id="room" hidden>
      <canvas id="libbg"></canvas>
      <canvas id="dust"></canvas>
      <div id="space"></div>
    </div>
    <p class="gesture" id="gesture" hidden></p>
    <p id="loadingShelf" class="loadingShelf">Memuat rak…</p>
    <label id="empty" class="empty" for="file" hidden>
      <strong>Rak masih kosong</strong>
      <span id="hint">Ketuk untuk mengunggah PDF atau EPUB, atau tarik file ke sini. Maksimal 50 MB per file.</span>
    </label>
  </section>
  <div id="drop" class="dropzone" hidden>Lepas untuk menaruh di rak</div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="shTitle">
      <div class="sheet-cover" id="shCover"></div>
      <div class="sheet-info">
        <h3 id="shTitle"></h3>
        <p class="sub" id="shSub"></p>
        <div class="bar"><span id="shBar"></span></div>
        <p class="where" id="shWhere"></p>
        <div class="row" id="shActs">
          <button class="btn primary sm" id="shRead">Mulai baca</button>
          <button class="btn ghost sm" id="shDel">Hapus</button>
        </div>

          <p id="shConfirmText"></p>

            <button class="btn ghost sm" id="shNo">Batal</button>

</div>

<div id="reader" hidden>
  <div class="rbar topbar">
    <button class="ibtn" id="back" aria-label="Kembali ke rak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="rtitle" id="rTitle"></div>
  </div>
  <div id="stage">
    <div id="book"><canvas id="cR"></canvas></div>
    <canvas id="fx" hidden></canvas>
    <div class="rload" id="rload" hidden></div>
  </div>
  <div class="rbar bottom">
    <button class="ibtn" id="prev" aria-label="Halaman sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <input type="range" id="slider" min="1" max="1" value="1" aria-label="Pindah ke halaman">
    <span class="pageno" id="pageno">–</span>
    <button class="ibtn" id="next" aria-label="Halaman berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="toast" id="toast" hidden><span id="toastText"></span><button class="btn primary" id="toastBtn"></button></div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const MAX_BYTES = 50 * 1024 * 1024; // Supabase free plan: 50 MB per file
  const coarse = matchMedia("(pointer: coarse)").matches;
  const DEVICE = coarse ? (Math.min(screen.width, screen.height) < 700 ? "HP" : "tablet") : "laptop";
  const SESSION = Math.random().toString(36).slice(2);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // pdf.js parses PDFs in a real Web Worker shipped with the app.
  const pdfjs = window.pdfjsLib || window["pdfjs-dist/build/pdf"] || null;
  if (pdfjs) pdfjs.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";
  const openPdf = (bytes) => pdfjs.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;

  // ---------- small helpers ----------
  const lsGet = (k) => { try { const v = localStorage.getItem("rakbaca:" + k); return v ? JSON.parse(v) : null; } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem("rakbaca:" + k, JSON.stringify(v)); } catch {} };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmtMB = (b) => (b / 1048576).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + " MB";
  const rtf = new Intl.RelativeTimeFormat("id", { numeric: "auto" });
  function rel(t) {
    const s = (t - Date.now()) / 1000, a = Math.abs(s);
    if (a < 60) return "baru saja";
    if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
    if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
    if (a < 86400 * 30) return rtf.format(Math.round(s / 86400), "day");
    return new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
    return el;
  }
  const cleanTitle = (name) => name.replace(/\.pdf$/i, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim() || "Tanpa judul";

  // IndexedDB cache of downloaded PDFs, so reopening a book doesn't redownload it.
  const idb = (() => {
    let p;
    const open = () => p || (p = new Promise((res, rej) => {
      try { const r = indexedDB.open("rakbaca", 1); r.onupgradeneeded = () => r.result.createObjectStore("pdf"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    }));
    const tx = async (mode, fn) => { try { const d = await open(); return await new Promise((res) => { const t = d.transaction("pdf", mode); const q = fn(t.objectStore("pdf")); t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => res(null); }); } catch { return null; } };
    return {
      get: (k) => tx("readonly", (s) => s.get(k)).then((v) => v || null),
      put: (k, v) => tx("readwrite", (s) => s.put(v, k)),
      del: (k) => tx("readwrite", (s) => s.delete(k)),
    };
  })();
  const memBytes = new Map();
  function remember(key, bytes) { memBytes.delete(key); memBytes.set(key, bytes); while (memBytes.size > 3) memBytes.delete(memBytes.keys().next().value); }

  // ---------- state ----------
  let db = null, assets = null, user = null, uid = null, libReady = false;
  let books = new Map();        // shared library: id -> {title, fileId, coverId, pages, sizeBytes, addedAt}
  let progress = new Map();     // this viewer's progress: id -> {page, total, updatedAt, device, session}
  const localBooks = new Map(); // opened without syncing (no account in this view)

  function setSync(s) {
    const el = $("#sync"); el.dataset.s = s;
    el.textContent = { ok: "Tersinkron", local: "Belum masuk", offline: "Offline · memakai salinan terakhir", err: "Gagal menyimpan, dicoba lagi saat pindah halaman", wait: "Menghubungkan…" }[s];
  }
  function say(kind, text) {
    const el = $("#say");
    if (!text) { el.hidden = true; return; }
    el.hidden = false; el.dataset.k = kind; el.textContent = text;
  }

  // ---------- cloud (Supabase) ----------
  // Books, covers and reading progress live in the reader's own Supabase project (see supabase/setup.sql).
  // Files sit in the private "books" bucket under <user id>/<book id>/; row-level security keeps each account to itself.
  const CFG = window.RAKBACA_CONFIG || {};
  const sb = CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase
    ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } })
    : null;
  const rowToBook = (r) => ({ kind: r.kind, title: r.title, author: r.author || "", fileId: r.file_path, coverId: r.cover_path, pages: r.pages, sizeBytes: r.size_bytes, addedAt: r.added_at, addedFrom: r.added_from });
  const rowToProg = (r) => ({ page: r.page, total: r.total, loc: r.loc || undefined, device: r.device, session: r.session, updatedAt: r.updated_at });
  const coverUrls = new Map();
  const cloud = {
    async loadBooks() {
      const { data, error } = await sb.from("books").select("*").order("added_at");
      if (error) throw error;
      const m = new Map(data.map((r) => [r.id, rowToBook(r)]));
      for (const b of m.values()) b.coverUrl = coverUrls.get(b.coverId) || null;
      return m;
    },
    async loadProgress() {
      const { data, error } = await sb.from("progress").select("*");
      if (error) throw error;
      return new Map(data.map((r) => [r.book_id, rowToProg(r)]));
    },
    async addBook(meta, fileBlob, fileType, coverBlob) {
      const id = crypto.randomUUID(), base = `${uid}/${id}/`;
      const filePath = base + (meta.kind === "epub" ? "book.json" : "book.pdf");
      let r = await sb.storage.from("books").upload(filePath, fileBlob, { contentType: fileType, upsert: false });
      if (r.error) throw r.error;
      let coverPath = null;
      if (coverBlob) {
        r = await sb.storage.from("books").upload(base + "cover.jpg", coverBlob, { contentType: "image/jpeg" });
        if (!r.error) coverPath = base + "cover.jpg";
      }
      const row = { id, user_id: uid, kind: meta.kind, title: meta.title, author: meta.author || null, file_path: filePath, cover_path: coverPath, pages: meta.pages, size_bytes: meta.sizeBytes, added_at: Date.now(), added_from: DEVICE };
      const ins = await sb.from("books").insert(row);
      if (ins.error) { await sb.storage.from("books").remove([filePath, coverPath].filter(Boolean)); throw ins.error; }
      return { id, filePath };
    },
    async deleteBook(id, b) {
      const del = await sb.from("books").delete().eq("id", id);
      if (del.error) throw del.error;
      await sb.storage.from("books").remove([b.fileId, b.coverId].filter(Boolean));
    },
    async fileUrl(b) {
      const { data, error } = await sb.storage.from("books").createSignedUrl(b.fileId, 3600);
      if (error) throw error;
      return data.signedUrl;
    },
    async saveProgress(id, body) {
      const { error } = await sb.from("progress").upsert({
        user_id: uid, book_id: id, page: body.page, total: body.total, loc: body.loc || null,
        device: body.device, session: body.session, updated_at: body.updatedAt,
      });
      if (error) throw error;
    },
  };
  // Covers are downloaded once and kept in IndexedDB, so the shelf shows them offline too.
  async function loadCover(b) {
    if (!b.coverId || coverUrls.has(b.coverId)) return;
    coverUrls.set(b.coverId, null);
    let blob = await idb.get("cover:" + b.coverId);
    if (!blob) {
      const { data } = await sb.storage.from("books").download(b.coverId);
      if (!data) { coverUrls.delete(b.coverId); return; }
      blob = data; idb.put("cover:" + b.coverId, blob);
    }
    const url = URL.createObjectURL(blob);
    coverUrls.set(b.coverId, url);
    for (const bk of books.values()) if (bk.coverId === b.coverId) bk.coverUrl = url;
    renderLibrary();
  }

  // ---------- account ----------
  let authMode = "in";
  function showAccount(user) {
    $("#auth").hidden = !!user || !sb;
    $("#account").hidden = !user; $("#account").textContent = user?.email || "";
    $("#logout").hidden = !user;
  }
  const authError = (e) => {
    const m = (e && e.message) || "";
    if (/invalid login credentials/i.test(m)) return "Email atau kata sandi salah.";
    if (/already registered/i.test(m)) return "Email ini sudah terdaftar. Coba masuk.";
    if (/password should be at least/i.test(m)) return "Kata sandi minimal 6 karakter.";
    if (/email not confirmed/i.test(m)) return "Email belum dikonfirmasi. Buka email dari Supabase lalu klik tautannya.";
    if (/fetch|network/i.test(m)) return "Tidak bisa terhubung. Periksa koneksi internet.";
    return m || "Gagal masuk. Coba lagi.";
  };
  $("#authMode").addEventListener("click", () => {
    authMode = authMode === "in" ? "up" : "in";
    $("#authGo").textContent = authMode === "in" ? "Masuk" : "Daftar";
    $("#authMode").textContent = authMode === "in" ? "Belum punya akun? Daftar" : "Sudah punya akun? Masuk";
    $("#password").autocomplete = authMode === "in" ? "current-password" : "new-password";
    $("#authMsg").textContent = "";
  });
  $("#auth").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sb) return;
    const email = $("#email").value.trim(), password = $("#password").value;
    const btn = $("#authGo"); btn.disabled = true; $("#authMsg").textContent = "Sebentar…";
    try {
      const res = authMode === "in" ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
      if (res.error) $("#authMsg").textContent = authError(res.error);
      else if (!res.data.session) $("#authMsg").textContent = "Akun dibuat. Buka email konfirmasi dari Supabase, lalu masuk di sini.";
      else { $("#authMsg").textContent = ""; $("#password").value = ""; }
    } catch (err) { $("#authMsg").textContent = authError(err); }
    finally { btn.disabled = false; }
  });
  $("#logout").addEventListener("click", () => sb && sb.auth.signOut());

  // ---------- boot ----------
  let refreshTimer = null, channel = null;
  async function refresh() {
    if (!uid) return;
    try {
      const [bk, pg] = await Promise.all([cloud.loadBooks(), cloud.loadProgress()]);
      books = bk; progress = pg; libReady = true;
      lsSet("cache:books:" + uid, [...books.entries()].map(([id, b]) => [id, Object.assign({}, b, { coverUrl: null })]));
      setSync("ok");
      for (const b of books.values()) loadCover(b);
      renderLibrary(); checkRemote();
    } catch {
      setSync("offline"); libReady = true; renderLibrary();
    }
  }
  const refreshSoon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 300); };
  async function startSession(session) {
    uid = session?.user?.id || null;
    showAccount(session?.user || null);
    if (channel) { sb.removeChannel(channel); channel = null; }
    if (!uid) {
      db = assets = null; books = new Map(); progress = new Map(); libReady = true;
      setSync("local"); renderLibrary(); return;
    }
    db = assets = cloud;
    // Show the last known shelf straight away (works offline), then refresh from the server.
    const cached = lsGet("cache:books:" + uid);
    if (cached) { books = new Map(cached); libReady = true; for (const b of books.values()) loadCover(b); renderLibrary(); }
    await refresh();
    channel = sb.channel("rak-" + uid)
      .on("postgres_changes", { event: "*", schema: "public", table: "books", filter: `user_id=eq.${uid}` }, refreshSoon)
      .on("postgres_changes", { event: "*", schema: "public", table: "progress", filter: `user_id=eq.${uid}` }, refreshSoon)
      .subscribe();
  }
  (async () => {
    queueMicrotask(renderLibrary);
    if (!sb) {
      libReady = true; setSync("local"); showAccount(null);
      $("#hint").textContent = "Ketuk untuk membuka PDF atau EPUB. Sinkron belum disetel, jadi buku hanya terbuka di perangkat ini.";
      renderLibrary(); return;
    }
    const { data } = await sb.auth.getSession();
    await startSession(data.session);
    sb.auth.onAuthStateChange((ev, session) => {
      if ((session?.user?.id || null) !== uid) startSession(session);
    });
  })();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && uid) refreshSoon(); });

  // ---------- library ----------
  function getProg(id) {
    const r = progress.get(id), l = lsGet("prog:" + id);
    if (r && (!l || r.updatedAt >= l.updatedAt)) return r;
    return l;
  }
  function renderLibrary() {
    const all = [...localBooks.entries(), ...books.entries()];
    all.sort((a, b) => (a[1].addedAt || 0) - (b[1].addedAt || 0)); // oldest first, so a new book takes the next free spot
    $("#room").hidden = all.length === 0;
    $("#gesture").hidden = all.length === 0;
    $("#gesture").textContent = coarse
      ? "Ketuk buku untuk membuka · geser untuk memindah · cubit dua jari untuk mendekat atau menjauh"
      : "Klik buku untuk membuka · seret untuk memindah · scroll di atas buku untuk mendekat atau menjauh";
    syncScene(all);
    $("#loadingShelf").hidden = libReady || all.length > 0;
    $("#empty").hidden = !(libReady && all.length === 0);
    $("#count").textContent = all.length ? all.length + " buku" : "";
    if (scene.sel) fillSheet(scene.sel);
  }

  // ---------- floating 3D books ----------
  // Every book is a CSS box drifting in a weightless scene: it wanders around its own spot and
  // slowly tumbles, each with its own speed and angle. Tapping one turns it to face you.
  const scene = { els: new Map(), sel: null, raf: 0 };
  const spineColors = new Map();
  const hashOf = (s) => { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return (x >>> 0) / 4294967295; };
  // Spine colour = the cover's left edge, a touch darker, so each book looks bound in its own cloth.
  function sampleSpine(img, id, el) {
    try {
      const c = document.createElement("canvas"); c.width = 12; c.height = 16;
      const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0, 12, 16);
      const d = x.getImageData(0, 0, 3, 16).data; let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      r = r / n * 0.82; g = g / n * 0.82; b = b / n * 0.82;
      const col = `rgb(${r | 0},${g | 0},${b | 0})`, ink = (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#141414" : "#FFFFFF";
      spineColors.set(id, [col, ink]);
      el.style.setProperty("--spine", col); el.style.setProperty("--spine-ink", ink);
    } catch {}
  }
  const coverOf = (b) => b.coverUrl || null;

  function makeBook(id, b, total) {
    const r = (k) => hashOf(id + k);
    const el = h("button", { class: "b3", "aria-label": "Lihat " + b.title });
    el.style.setProperty("--t", Math.round(clamp(9 + (total || 40) * 0.07, 10, 34)) + "px");
    const known = spineColors.get(id);
    if (known) { el.style.setProperty("--spine", known[0]); el.style.setProperty("--spine-ink", known[1]); }
    const src = coverOf(b);
    const ph = h("span", { class: "ph", text: b.title });
    const prog = h("span", { class: "prog" });
    const front = h("div", { class: "f front" },
      src ? h("img", { src, alt: "", draggable: "false", onload: (e) => { if (!spineColors.has(id)) sampleSpine(e.target, id, el); }, onerror: (e) => e.target.replaceWith(ph) }) : ph,
      prog);
    const body = h("div", { class: "body" }, front,
      h("div", { class: "f back" }),
      h("div", { class: "f spine" }, h("span", { text: b.title })),
      h("div", { class: "f pages" }),
      h("div", { class: "f top" }));
    el.append(body, h("span", { class: "cap", text: b.title }));
    const s = {
      id, el, body, prog, fs: h("div", { class: "fs" }), hover: 0, focus: 0, bx: null, by: null, tx: 0, ty: 0, enterAt: 0,
      rx0: (r("a") - 0.5) * 56, ry0: (r("b") - 0.5) * 100, rz0: (r("c") - 0.5) * 70,
      ax: 14 + r("d") * 22, ay: 10 + r("e") * 18,
      fx: 0.13 + r("f") * 0.17, fy: 0.17 + r("g") * 0.2, fr: 0.12 + r("h") * 0.16,
      z0: -440 + r("z") * 520, az: 50 + r("q") * 90, fz: 0.07 + r("k") * 0.09, zUser: 0,
      p: [1, 2, 3, 4, 5, 6].map((k) => r("p" + k) * Math.PI * 2),
    };
    el.addEventListener("pointerenter", () => { s.hover = 1; });
    el.addEventListener("pointerleave", () => { s.hover = 0; });
    s.front = front; s.coverSrc = src;
    attachDrag(s);
    return s;
  }

  let sceneStarted = false;
  function syncScene(all) {
    const space = $("#space"), now = performance.now();
    const ids = new Set(all.map((a) => a[0]));
    for (const [id, s] of scene.els) if (!ids.has(id)) { s.el.remove(); s.fs.remove(); scene.els.delete(id); }
    all.forEach(([id, b], i) => {
      const pr = getProg(id), total = b.pages || pr?.total || 0, page = pr?.page || 0;
      let s = scene.els.get(id);
      if (!s) {
        s = makeBook(id, b, total);
        s.enterAt = now + (sceneStarted ? 0 : i * 110);
        scene.els.set(id, s); space.prepend(s.fs); space.append(s.el);
      }
      s.index = i;
      if (b.coverUrl && s.coverSrc !== b.coverUrl) {
        s.coverSrc = b.coverUrl;
        s.front.replaceChildren(h("img", { src: b.coverUrl, alt: "", draggable: "false", onload: (e) => { if (!spineColors.has(id)) sampleSpine(e.target, id, s.el); } }), s.prog);
      }
      s.prog.style.width = (total && page ? Math.max(1, Math.round((page / total) * 100)) : 0) + "%";
    });
    if (all.length) sceneStarted = true;
    layoutScene(); kick();
  }

  // Spread books over a loose, jittered grid; every resize or new book glides them to new spots.
  function layoutScene() {
    const space = $("#space");
    const W = space.clientWidth || 320, n = scene.els.size;
    if (!n) return;
    const bw = parseFloat(getComputedStyle(space).getPropertyValue("--w")) || 100, bh = bw * 1.42;
    const cols = clamp(Math.floor(W / (bw * 1.85)), 1, Math.max(1, n));
    const rows = Math.ceil(n / cols);
    const cw = W / cols, ch = bh * 1.5;
    const minH = Math.max(420, Math.min(window.innerHeight * 0.72, 720));
    const H = Math.max(minH, rows * ch + 80);
    space.style.height = H + "px";
    Object.assign(scene, { H, W, bw, bh });
    const dust = $("#dust"), room = $("#room"), dpr = Math.min(2, window.devicePixelRatio || 1);
    dust.width = room.clientWidth * dpr; dust.height = H * dpr; scene.dpr = dpr;
    drawLibrary(room.clientWidth, H);
    scene.dustRgb = getComputedStyle(document.documentElement).getPropertyValue("--dust").trim();
    const top = (H - rows * ch) / 2;
    for (const s of scene.els.values()) {
      const row = Math.floor(s.index / cols), col = s.index % cols;
      const inRow = row === rows - 1 ? n - row * cols : cols; // centre a short last row
      const rowOff = (cols - inRow) * cw / 2;
      const jx = (hashOf(s.id + "x") - 0.5) * cw * 0.4, jy = (hashOf(s.id + "y") - 0.5) * ch * 0.35;
      s.tx = clamp(rowOff + cw * (col + 0.5) + jx - bw / 2, 8, W - bw - 8);
      s.ty = top + ch * row + (ch - bh) / 2 + jy;
      const saved = lsGet("pos:" + s.id);
      if (saved && !s.drag && !s.thrown) { s.tx = clamp(saved.x * W, -bw * 0.15, W - bw * 0.85); s.ty = clamp(saved.y * H, -bh * 0.1, H - bh * 0.9); s.zUser = saved.z || 0; s.custom = true; $("#tidy").hidden = false; }
      if (s.bx == null) { s.bx = s.tx; s.by = s.ty; }
    }
  }

  // Fine dust hanging in the air, catching the light: tiny dots drifting slowly upward and sideways.

    await deleteBook(id, b, e.currentTarget);
    if (!books.has(id) && !localBooks.has(id)) closeSheet();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && scene.sel && $("#reader").hidden) closeSheet(); });

  async function deleteBook(id, b, btn) {
    btn.disabled = true;
    if (b.local) { localBooks.delete(id); memBytes.delete(id); renderLibrary(); return; }
    try {
      await cloud.deleteBook(id, b);
      idb.del(b.fileId); memBytes.delete(b.fileId);
      if (b.coverId) idb.del("cover:" + b.coverId);
      await refresh();
      say("ok", `${b.title} sudah dihapus dari rak.`);
    } catch {
      btn.disabled = false;
      say("err", "Buku belum terhapus. Periksa koneksi lalu coba lagi.");
    }
  }

  // ---------- EPUB ----------
  // The asset store can't hold .epub files, so an EPUB is unpacked on upload into a JSON "book":
  // text blocks with bold/italic runs, headings, list items, quotes and images (small JPEG data URLs).
  // When reading, those blocks are typeset onto canvas pages sized to the screen, so the paper curl works the same.
  const EPUB_FONT = '"Literata", Georgia, "Times New Roman", serif';
  const isEpubFile = (f) => f.type === "application/epub+zip" || /\.epub$/i.test(f.name);
  const isPdfFile = (f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  const BOLD = 1, ITALIC = 2;
  const IMG_TYPES = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml" };

  async function importEpub(file, onStep) {
    if (!window.JSZip) throw new Error("nozip");
    const zip = await JSZip.loadAsync(file);
    const read = (p) => (p && zip.file(p) ? zip.file(p).async("string") : Promise.resolve(null));
    const parse = (s, type) => new DOMParser().parseFromString(s, type);
    const container = await read("META-INF/container.xml");
    if (!container) throw new Error("bad");
    const opfPath = parse(container, "application/xml").querySelector("rootfile")?.getAttribute("full-path");
    const opfText = await read(opfPath);
    if (!opfText) throw new Error("bad");
    const opf = parse(opfText, "application/xml");
    const resolve = (from, href) => { try { return decodeURIComponent(new URL(href, "https://x/" + from).pathname.slice(1)); } catch { return null; } };
    const manifest = new Map();
    for (const it of opf.querySelectorAll("manifest > item")) {
      manifest.set(it.getAttribute("id"), { href: resolve(opfPath, it.getAttribute("href") || ""), type: it.getAttribute("media-type") || "", props: it.getAttribute("properties") || "" });
    }
    const dc = (n) => opf.getElementsByTagNameNS("http://purl.org/dc/elements/1.1/", n)[0]?.textContent.trim() || "";
    const spine = [...opf.querySelectorAll("spine > itemref")].map((r) => manifest.get(r.getAttribute("idref"))).filter((m) => m && /html|xml/.test(m.type));
    let coverItem = [...manifest.values()].find((m) => /cover-image/.test(m.props));
    if (!coverItem) {
      const cid = [...opf.querySelectorAll("meta")].find((m) => m.getAttribute("name") === "cover")?.getAttribute("content");
      if (cid) coverItem = manifest.get(cid);
    }

    let budget = 40 * 1024 * 1024;
    const imgCache = new Map();
    async function imageData(path, maxSide) {
      const key = path + "@" + maxSide;
      if (imgCache.has(key)) return imgCache.get(key);
      let out = null;
      try {
        const f = zip.file(path);
        if (f) {
          const ext = (path.split(".").pop() || "").toLowerCase();
          const blob = new Blob([await f.async("arraybuffer")], { type: IMG_TYPES[ext] || "image/jpeg" });
          let bmp;
          try { bmp = await createImageBitmap(blob); }
          catch { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(blob); }); }
          const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
          const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(bmp.width * s)); c.height = Math.max(1, Math.round(bmp.height * s));
          const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
          const src = c.toDataURL("image/jpeg", 0.8);
          if (src.length < budget) { budget -= src.length; out = { src, w: c.width, h: c.height, canvas: c }; }
        }
      } catch {}
      imgCache.set(key, out);
      return out;
    }

    const blocks = [];
    let runs = [], meta = {};
    const BLOCK = /^(p|div|h[1-6]|li|blockquote|pre|section|article|figure|figcaption|header|footer|aside|nav|table|tr|td|th|ul|ol|dl|dt|dd|body|center|main|address)$/;
    const flush = () => {
      if (runs.some((r) => r[0].trim())) {
        const merged = [];
        for (const r of runs) { const last = merged[merged.length - 1]; if (last && last[1] === r[1]) last[0] += r[0]; else merged.push([r[0], r[1]]); }
        blocks.push(Object.assign({ t: meta.h ? "h" : "p", r: merged }, meta.h ? { l: meta.h } : {}, meta.li ? { li: 1 } : {}, meta.q ? { q: 1 } : {}));
      }
      runs = [];
    };
    function walk(node, style, chap) {
      for (const n of node.childNodes) {
        if (n.nodeType === 3) { const s = n.nodeValue.replace(/\s+/g, " "); if (s) runs.push([s, style]); continue; }
        if (n.nodeType !== 1) continue;
        const tag = (n.localName || "").toLowerCase();
        if (tag === "script" || tag === "style" || tag === "head" || tag === "title") continue;
        if (tag === "br") { runs.push(["\n", style]); continue; }
        if (tag === "hr") { flush(); blocks.push({ t: "hr" }); continue; }
        if (tag === "img" || tag === "image") {
          const href = n.getAttribute("src") || n.getAttribute("href") || n.getAttributeNS("http://www.w3.org/1999/xlink", "href");
          if (href) { flush(); blocks.push({ t: "img", path: resolve(chap, href) }); }
          continue;
        }
        let st = style;
        if (/^(em|i|cite|var|dfn)$/.test(tag)) st |= ITALIC;
        if (/^(strong|b|th)$/.test(tag)) st |= BOLD;
        if (/^h[1-6]$/.test(tag)) {
          flush(); const prev = meta; meta = Object.assign({}, meta, { h: +tag[1] }); walk(n, st | BOLD, chap); flush(); meta = prev; continue;
        }
        if (tag === "li" || tag === "blockquote") {
          flush(); const prev = meta; meta = Object.assign({}, meta, tag === "li" ? { li: 1 } : { q: 1 });
          if (tag === "li") runs.push(["• ", style]);
          walk(n, st, chap); flush(); meta = prev; continue;
        }
        if (BLOCK.test(tag)) { flush(); walk(n, st, chap); flush(); continue; }
        walk(n, st, chap);
      }
    }
    for (let i = 0; i < spine.length; i++) {
      onStep?.(`Membaca bab ${i + 1} dari ${spine.length}…`);
      const text = await read(spine[i].href);
      if (!text) continue;
      let doc = parse(text, "application/xhtml+xml");
      if (doc.getElementsByTagName("parsererror").length) doc = parse(text, "text/html");
      const body = doc.body || doc.getElementsByTagName("body")[0];
      if (!body) continue;
      if (blocks.length && blocks[blocks.length - 1].t !== "ch") blocks.push({ t: "ch" });
      runs = []; meta = {};
      walk(body, 0, spine[i].href); flush();
    }
    onStep?.("Menyiapkan gambar…");
    const out = [];
    for (const b of blocks) {
      if (b.t !== "img") { out.push(b); continue; }
      const im = b.path ? await imageData(b.path, 1100) : null;
      if (im) out.push({ t: "img", src: im.src, w: im.w, h: im.h });
    }
    while (out.length && out[out.length - 1].t === "ch") out.pop();
    if (!out.some((b) => b.t === "p" || b.t === "h" || b.t === "img")) throw new Error("empty");

    const title = dc("title") || cleanTitle(file.name.replace(/\.epub$/i, ""));
    const author = dc("creator");
    let coverCanvas = null;
    if (coverItem?.href) coverCanvas = (await imageData(coverItem.href, 640))?.canvas || null;
    if (!coverCanvas) {
      const first = out.find((b) => b.t === "img");
      if (first) { const im = new Image(); im.src = first.src; try { await im.decode(); const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; c.getContext("2d").drawImage(im, 0, 0); coverCanvas = c; } catch {} }
    }
    if (!coverCanvas) coverCanvas = await plainCover(title, author);
    const cover = await new Promise((res) => coverCanvas.toBlob(res, "image/jpeg", 0.85));
    const words = out.reduce((n, b) => n + (b.r ? b.r.reduce((m, r) => m + r[0].split(/\s+/).length, 0) : 0), 0);
    let book = { v: 1, title, author, blocks: out };
    let json = JSON.stringify(book);
    if (json.length > MAX_BYTES - 200000) { book = { v: 1, title, author, blocks: out.filter((b) => b.t !== "img") }; json = JSON.stringify(book); }
    return { title, author, json, cover, pages: Math.max(1, Math.round(words / 260)) };
  }

  // A quiet generated cover for EPUBs that ship without one: title and author set on grey paper.
  async function plainCover(title, author) {
    await loadBookFonts();
    const c = document.createElement("canvas"); c.width = 320; c.height = 456;
    const x = c.getContext("2d");
    x.fillStyle = "#E8E8E8"; x.fillRect(0, 0, 320, 456);
    x.fillStyle = "#1A1A1A"; x.textAlign = "center";
    x.font = `600 26px ${EPUB_FONT}`;
    const words = title.split(/\s+/), lines = [];
    let line = "";
    for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > 250 && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    lines.slice(0, 5).forEach((l, i) => x.fillText(l, 160, 150 + i * 34));
    if (author) { x.font = `400 15px ${EPUB_FONT}`; x.fillStyle = "#6A6A6A"; x.fillText(author, 160, 400); }
    return c;
  }

  let fontsReady = null;
  function loadBookFonts() {
    if (!fontsReady) {
      const want = [`400 16px ${EPUB_FONT}`, `italic 400 16px ${EPUB_FONT}`, `600 16px ${EPUB_FONT}`, `italic 600 16px ${EPUB_FONT}`];
      fontsReady = Promise.race([
        Promise.all(want.map((f) => document.fonts?.load(f).catch(() => null))),
        new Promise((r) => setTimeout(r, 2500)),
      ]);
    }
    return fontsReady;
  }

  // Typeset the book into pages of W×H CSS px. Each page keeps where it starts ({b: block, w: word})
  // so the reading position survives a different screen size on another device.
  function typesetEpub(book, W, H) {
    const blocks = book.blocks;
    const fs = clamp(W / 23, 15, 19.5), lh = fs * 1.58;
    const mx = Math.round(clamp(W * 0.09, 20, 60)), top = Math.round(clamp(H * 0.075, 26, 64)), bottom = H - Math.round(clamp(H * 0.085, 34, 70));
    const cw = W - mx * 2;
    const mc = document.createElement("canvas").getContext("2d");
    const font = (st, size) => `${st & ITALIC ? "italic " : ""}${st & BOLD ? 600 : 400} ${size.toFixed(2)}px ${EPUB_FONT}`;
    const wcache = new Map();
    const measure = (s, f) => { const k = f + "|" + s; let w = wcache.get(k); if (w == null) { mc.font = f; w = mc.measureText(s).width; wcache.set(k, w); } return w; };
    const pages = [];
    let page, y;
    const newPage = (b, w) => { page = { start: { b, w }, ops: [] }; pages.push(page); y = top; };
    newPage(0, 0);
    let afterHeading = true, chapterTop = true;
    blocks.forEach((blk, bi) => {
      if (blk.t === "ch") { if (page.ops.length) newPage(bi, 0); afterHeading = true; chapterTop = true; return; }
      if (blk.t === "hr") { if (y + lh * 2 > bottom) newPage(bi, 0); page.ops.push({ k: "hr", y: y + lh }); y += lh * 2; afterHeading = true; return; }
      if (blk.t === "img") {
        let s = Math.min(cw / blk.w, (bottom - top) / blk.h, 1.25);
        // Shrink to fit what's left of the page when that keeps at least 55% of its size; otherwise start a new page.
        if (y + blk.h * s > bottom && page.ops.length && (bottom - y) < blk.h * s * 0.55) newPage(bi, 0);
        s = Math.min(s, (bottom - y) / blk.h);
        const dw = blk.w * s, dh = blk.h * s;
        page.ops.push({ k: "img", bi, x: mx + (cw - dw) / 2, y, w: dw, h: dh });
        y += dh + lh * 0.6; afterHeading = false; chapterTop = false;
        return;
      }
      const isH = blk.t === "h";
      const size = isH ? fs * (blk.l <= 1 ? 1.55 : blk.l === 2 ? 1.32 : 1.14) : fs;
      const lineH = isH ? size * 1.32 : lh;
      const left = mx + (blk.q ? fs * 1.4 : 0) + (blk.li ? fs * 0.4 : 0);
      const width = cw - (left - mx) - (blk.q ? fs * 0.8 : 0);
      const indent = !isH && !afterHeading && !blk.li && !blk.q ? fs * 1.4 : 0;
      if (isH) {
        if (chapterTop && page.ops.length === 0) y = top + (H - top) * 0.1;
        else { y += lineH * 0.9; if (y + lineH * 3 > bottom) newPage(bi, 0); }
      } else if ((blk.q || blk.li) && !afterHeading) y += lh * 0.15;

      // Words with their style; `sp` marks a space before the word, `br` a forced line break.
      const toks = [];
      let pendingSpace = false;
      for (const [text, st] of blk.r) {
        const f = font(blk.q ? st ^ ITALIC : st, size); // quotes are set in italic
        for (const part of text.split(/(\n| +)/)) {
          if (!part) continue;
          if (part === "\n") { toks.push({ br: true }); pendingSpace = false; continue; }
          if (/^ +$/.test(part)) { pendingSpace = true; continue; }
          toks.push({ s: part, f, w: measure(part, f), sp: pendingSpace });
          pendingSpace = false;
        }
      }
      const spaceW = measure(" ", font(0, size));
      let line = [], lw = 0, first = true;
      const emit = (justify) => {
        if (!line.length) { y += lineH * (first ? 0 : 1); return; }
        if (y + lineH > bottom) newPage(bi, line[0].i);
        const ind = first ? indent : 0, avail = width - ind;
        let gaps = 0, natural = 0;
        line.forEach((t, k) => { natural += t.w; if (k && t.sp) { natural += spaceW; gaps++; } });
        let extra = justify && !isH && gaps ? (avail - natural) / gaps : 0;
        if (extra > spaceW * 2.2) extra = 0;
        let x = isH ? left + Math.max(0, (width - natural) / 2) : left + ind;
        const base = y + (lineH - size) / 2 + size * 0.8;
        line.forEach((t, k) => {
          if (k && t.sp) x += spaceW + extra;
          page.ops.push({ k: "t", x, y: base, s: t.s, f: t.f });
          x += t.w;
        });
        y += lineH; first = false; line = []; lw = 0;
      };
      toks.forEach((t, i) => {
        if (t.br) { emit(false); return; }
        t.i = i;
        const add = (line.length && t.sp ? spaceW : 0) + t.w;
        if (line.length && lw + add > width - (first ? indent : 0)) { emit(true); line.push(t); lw = t.w; }
        else { line.push(t); lw += add; }
      });
      emit(false);
      if (isH) y += lineH * 0.55;
      afterHeading = isH; chapterTop = false;
    });
    if (pages.length > 1 && !pages[pages.length - 1].ops.length) pages.pop();
    return pages;
  }

  const locBefore = (a, b) => a.b < b.b || (a.b === b.b && a.w <= b.w);
  function pageForLoc(loc) {
    if (!loc || !R.pages) return 1;
    let p = 1;
    for (let i = 0; i < R.pages.length; i++) { if (locBefore(R.pages[i].start, loc)) p = i + 1; else break; }
    return p;
  }
  const currentLoc = () => (R.pages && R.pages[R.page - 1] ? R.pages[R.page - 1].start : null);

  function renderEpubPage(n, Wd, Hd) {
    const c = document.createElement("canvas"); c.width = Wd; c.height = Hd;
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, Wd, Hd);
    const s = Wd / R.pageW; x.scale(s, s);
    const pg = R.pages[n - 1];
    x.fillStyle = "#1C1C1C"; x.textBaseline = "alphabetic";
    let lastF = "";
    for (const op of pg.ops) {
      if (op.k === "t") { if (op.f !== lastF) { x.font = op.f; lastF = op.f; } x.fillText(op.s, op.x, op.y); }
      else if (op.k === "img") { const im = R.epubImgs.get(op.bi); if (im) x.drawImage(im, op.x, op.y, op.w, op.h); }
      else if (op.k === "hr") { x.fillStyle = "#9A9A9A"; x.font = `400 14px ${EPUB_FONT}`; lastF = ""; x.textAlign = "center"; x.fillText("⁂", R.pageW / 2, op.y); x.textAlign = "left"; x.fillStyle = "#1C1C1C"; }
    }
    x.fillStyle = "#A0A0A0"; x.font = `400 11px ${EPUB_FONT}`; x.textAlign = "center";
    x.fillText(String(n), R.pageW / 2, R.pageH - Math.round(clamp(R.pageH * 0.04, 16, 30)));
    return c;
  }

  async function renderCover(pdf) {
    const page = await pdf.getPage(1);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 320 / vp1.width });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    return new Promise((res) => c.toBlob(res, "image/jpeg", 0.82));
  }

  const uploadMsg = (e) => ({
    too_large: "File ini lebih dari 50 MB. Kompres dulu lalu coba lagi.",
    quota_or_state: "Penyimpanan rak sudah penuh. Hapus buku yang sudah selesai lalu coba lagi.",
    rate_limited: "Terlalu banyak unggahan sekaligus. Tunggu sebentar lalu coba lagi.",
    upstream_auth: "Sesi kamu sudah habis. Muat ulang halaman ini lalu coba lagi.",
    unsupported_type: "Format file ini tidak didukung.",
  }[e && (e.code || (String(e.statusCode) === "413" || /exceeded|too large/i.test(e.message || "") ? "too_large" : ""))] || "Unggahan gagal. Periksa koneksi lalu coba lagi.");

  let uploading = false;
  async function handleFile(file) {
    if (!file || uploading) return;
    const epub = isEpubFile(file);
    if (!epub && !isPdfFile(file)) return say("err", `"${file.name}" bukan PDF atau EPUB. Pilih file berakhiran .pdf atau .epub.`);
    if (!epub && !pdfjs) return say("err", "Pembaca PDF gagal dimuat. Muat ulang halaman ini.");
    if (epub && !window.JSZip) return say("err", "Pembaca EPUB gagal dimuat. Muat ulang halaman ini.");
    let title = cleanTitle(file.name.replace(/\.epub$/i, ""));
    const sync = !!(db && assets);
    if (!epub && sync && file.size > MAX_BYTES) return say("err", `${title} berukuran ${fmtMB(file.size)}, batasnya 50 MB per file. Kompres dulu PDF-nya lalu coba lagi.`);
    uploading = true;
    try {
      say("busy", `Membaca ${title}…`);
      let bytes, pages, cover = null, author = "";
      try {
        if (epub) {
          const r = await importEpub(file, (m) => say("busy", `${title}: ${m}`));
          ({ title, author, pages, cover } = r);
          bytes = new TextEncoder().encode(r.json);
        } else {
          bytes = new Uint8Array(await file.arrayBuffer());
          const pdf = await openPdf(bytes);
          pages = pdf.numPages;
          try { cover = await renderCover(pdf); } catch {}
          pdf.destroy();
        }
      } catch { return say("err", `${title} tidak bisa dibuka. Mungkin filenya rusak${epub ? " atau dikunci DRM" : " atau dikunci kata sandi"}.`); }
      const kind = epub ? "epub" : "pdf";

      if (!sync) {
        const id = "local-" + Date.now().toString(36);
        localBooks.set(id, { kind, title, author, pages, sizeBytes: file.size, addedAt: Date.now(), local: true, coverUrl: cover ? URL.createObjectURL(cover) : null });
        remember(id, bytes); renderLibrary();
        say("ok", sb ? `${title} dibuka sementara di perangkat ini. Masuk dulu supaya bukunya tersimpan dan sinkron ke HP dan laptop.` : `${title} dibuka di perangkat ini saja.`);
        return;
      }
      if (bytes.length > MAX_BYTES) return say("err", `${title} terlalu besar setelah dibongkar (${fmtMB(bytes.length)}). Batasnya 50 MB.`);
      say("busy", `Mengunggah ${title}…`);
      try {
        const blob = epub ? new Blob([bytes], { type: "application/json" }) : file;
        const { filePath } = await cloud.addBook({ kind, title, author, pages, sizeBytes: file.size }, blob, epub ? "application/json" : "application/pdf", cover);
        remember(filePath, bytes); idb.put(filePath, bytes);
        await refresh();
        say("ok", `${title} masuk rak. Buka Rak Baca di perangkat lain, bukunya sudah ada di sana.`);
      } catch (e) { say("err", uploadMsg(e)); }
    } finally { uploading = false; $("#file").value = ""; }
  }

  $("#file").addEventListener("change", (e) => handleFile(e.target.files[0]));
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { if (!$("#reader").hidden) return; e.preventDefault(); drop.hidden = false; }));
  ["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); if (t === "dragleave" && e.relatedTarget) return; drop.hidden = true; }));
  document.addEventListener("drop", (e) => { if ($("#reader").hidden && e.dataTransfer?.files?.[0]) handleFile(e.dataTransfer.files[0]); });

  // ---------- reader ----------
  const stage = $("#stage"), bookEl = $("#book"), cR = $("#cR");
  let fx = $("#fx");
  const R = {
    id: null, book: null, pdf: null, n: 0, page: 1, ar: 0.707,
    pageW: 0, pageH: 0, pageX: 0, pageY: 0, stageW: 0, stageH: 0, dpr: 1,
    cache: new Map(), tick: 0, flip: null,
    savedPage: 0, savedId: null, writing: false, again: false, openedAt: 0, toastFor: 0, wake: null,
  };
  const cssVar = (name, fb) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb;
  function hexRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex); const v = m ? parseInt(m[1], 16) : 0xF1EFEA;
    return [(v >> 16 & 255) / 255, (v >> 8 & 255) / 255, (v & 255) / 255];
  }

  function rload(text, err) {
    const el = $("#rload");

    if (!R.pdf || !R.id) return;
    const pr = progress.get(R.id);
    if (!pr || pr.session === SESSION || pr.updatedAt <= R.openedAt || R.toastFor === pr.updatedAt) return;
    const epub = R.kind === "epub";
    const target = epub ? (pr.loc ? pageForLoc(pr.loc) : clamp(Math.round((pr.page / (pr.total || 1)) * R.n), 1, R.n)) : pr.page;
    if (target === R.page) return;
    R.toastFor = pr.updatedAt;
    const t = $("#toast");
    const where = epub ? `${Math.round((pr.page / (pr.total || 1)) * 100)}%` : `hal. ${pr.page}`;
    $("#toastText").textContent = `Di ${pr.device || "perangkat lain"} kamu sudah sampai ${where}.`;
    $("#toastBtn").textContent = "Lompat ke sana";
    $("#toastBtn").onclick = () => { t.hidden = true; jump(target); };
    t.hidden = false;
    clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 9000);
  }
  // Android back button (APK): close the reader or the book panel first, then leave the app.
  const capApp = window.Capacitor?.Plugins?.App;
  if (capApp) capApp.addListener("backButton", () => {
    if (!$("#reader").hidden) closeReader();
    else if (scene.sel) closeSheet();
    else capApp.exitApp();
  });
  // In a browser, cache the app itself so it opens offline and can be installed to the home screen.
  if ("serviceWorker" in navigator && !window.Capacitor?.isNativePlatform?.() && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
